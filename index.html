function memDB(seed){
  const store={},subs=[];

function ac(){

function tone(f,t,d,type,vol){
  const a=AC;if(!a||!sndOn())return;
  const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+t;
  o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol||.14,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.05);
}
const SFX={

  tick:()=>tone(880,0,.07,'square',.05),
  lock:()=>tone(660,0,.1,'triangle',.1),
  join:()=>tone(784,0,.12,'sine',.08),
  reveal:()=>{tone(392,0,.15);tone(523,.12,.4)},
  good:()=>[659,784,988,1319].forEach((f,i)=>tone(f,i*.08,.3)),
  bad:()=>{tone(196,0,.28,'sawtooth',.09);tone(165,.14,.38,'sawtooth',.09)},

};

let VOICE=null;
const hasTTS=()=>'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function pickVoice(){
  if(!hasTTS())return;
  const vs=speechSynthesis.getVoices().filter(v=>/^nl/i.test(v.lang));
  const nl=vs.filter(v=>/^nl[-_]NL/i.test(v.lang));
  VOICE=nl.find(v=>/google|natural|neural|online|premium|enhanced|siri/i.test(v.name))||nl[0]||vs[0]||null;
}

const ttsOn=()=>{const v=ls.get('pq-tts');return v==null?true:v};
function say(text,force){
  try{
    if(!hasTTS()||!text)return;
    if(!force&&(!ttsOn()||!sndOn()||!outHere()||S.role!=='host'))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='nl-NL';if(VOICE)u.voice=VOICE;u.rate=1;u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---- achtergrondmuziek tijdens het aftellen ---- */
let MUS=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function note(m,at,d,type,vol){
  const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=mtof(m);
  g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(vol,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+d);
  o.connect(g);g.connect(a.destination);o.start(at);o.stop(at+d+.05);
}
const SONG=[[45,[57,60,64]],[41,[53,57,60]],[48,[55,60,64]],[43,[55,59,62]]];
const EIGHTH=60/132/2;
function musStep(i,at){
  const [root,ch]=SONG[(i>>3)%4],k=i%8;
  const d=hasTTS()&&speechSynthesis.speaking?.35:1;
  if(k===0||k===3||k===4||k===6)note(root,at,EIGHTH*1.6,'triangle',.11*d);
  note(ch[[0,1,2,1,0,1,2,1][k]]+12,at,EIGHTH*.8,'square',.022*d);
  if(k%2===1)note(ch[2]+24,at,.05,'sine',.012);
}
function musSched(){
  if(!MUS||!AC)return;
  while(MUS.next<AC.currentTime+.25){musStep(MUS.step,MUS.next);MUS.step=(MUS.step+1)%32;MUS.next+=EIGHTH}
}
function musicSync(want){
  try{
    if(want&&!outHere())want=false;
    if(want&&sndOn()&&!MUS){const a=ac();if(!a||a.state!=='running')return;MUS={next:a.currentTime+.05,step:0,t:setInterval(musSched,60)};musSched()}
    else if((!want||!sndOn())&&MUS){clearInterval(MUS.t);MUS=null}
  }catch(e){}
}

/* ---- realtime ---- */
function unwatch(){S.unsubs.forEach(f=>f());S.unsubs=[];if(S.ansUnsub){S.ansUnsub();S.ansUnsub=null}S.ans={};S.curKey='';S.myAns=null}
function watchGame(){
  unwatch();
  S.unsubs.push(ref(S.code).onSnapshot(s=>{S.game=s.exists?s.data(SNAP):null;onGame();render()},dbErr));
  if(S.role==='host')S.unsubs.push(ref(S.code).collection('players').onSnapshot(s=>{const o=Object.keys(S.players).length;S.players={};s.forEach(d=>{S.players[d.id]=d.data()});if(o>0&&Object.keys(S.players).length>o)sfx('join');render()},dbErr));
  if(S.role==='host')S.unsubs.push(ref(S.code).collection('questions').onSnapshot(s=>{S.qs={};s.forEach(d=>{S.qs[d.id]=d.data()});render()},dbErr));
}
function onGame(){
  const g=S.game;if(!g)return;
  const key=g.phase==='play'?g.run+'_'+g.idx:'';
  const wasRev=S.lastRev,wasPhase=S.lastPhase;S.lastRev=g.rev;S.lastPhase=g.phase;
  if(key===S.curKey){
    if(g.phase==='play'&&g.rev&&wasRev===false){
      if(S.role==='host')sfx(S.hostMe&&g.cur&&g.cur.aid!==S.hostMe.id?(S.myAns===g.c?'good':'bad'):'reveal');
      else if(g.cur&&g.cur.aid!==(meNow()||{}).id)sfx(S.myAns===g.c?'good':'bad');
    }
    return;
  }
  if(g.phase==='done'&&wasPhase==='play')sfx('win');
  S.curKey=key;S.myAns=null;S.tq=Date.now();S.revealing=false;S.stKey='';S.lastTick=-1;
  if(S.ansUnsub){S.ansUnsub();S.ansUnsub=null;S.ans={}}
  if(!key)return;
  if(S.trial)botsPlay(key);
  if(S.role==='host')S.ansUnsub=ref(S.code).collection('answers').where('k','==',key).onSnapshot(s=>{S.ans={};s.forEach(d=>{const x=d.data(SNAP);S.ans[x.p]=x});render()},dbErr);
  const me=meNow();
  if(me)ref(S.code).collection('answers').doc(key+'_'+me.id).get().then(d=>{if(d.exists&&S.curKey===key){S.myAns=d.data().a;render()}}).catch(()=>{});
}
function leave(){unwatch();S.view=false;if(hasTTS())speechSynthesis.cancel();if(S.trial){S.trial=false;DB=REAL}S.players={};S.revealing=false;S.role='home';S.game=null;S.qs={};S.mine=null;S.me=null;S.hostMe=null;S.skip=false;S.formOpen=false;S.code='';S.err='';render()}

/* ---- player ---- */
async function join(){
  const code=$('jc').value.trim().toUpperCase(),name=$('jn').value.trim();
  if(!code||!name){fail('Vul de code en je naam in.');return}
  try{
    const g=await ref(code).get();
    if(!g.exists){fail('Deze code bestaat niet. Controleer de code of vraag de quizmaster om een nieuwe.');return}
    const id=idOf(name),q=await ref(code).collection('questions').doc(id).get();
    S.role='player';S.code=code;S.me={id,name};S.mine=q.exists?q.data():null;S.skip=false;
    S.formOpen=!S.mine&&g.data().phase==='collect';
    S.imgs=(S.mine?S.mine.qs:[]).map(x=>x.img||'');
    ls.set('pq-me',{code,name});wake();beat();watchGame();render();
    if(S.formOpen)loadTaken().then(render);
  }catch(e){dbErr()}
}
function beat(){
  const me=S.role==='player'?S.me:(S.role==='host'&&!S.view&&!S.trial?S.hostMe:null);if(!me||!S.code)return;
  ref(S.code).collection('players').doc(me.id).set({name:me.name,seen:Date.now()},{merge:true}).catch(()=>{});
}
const pre=g=>((g.cur&&g.cur.cd)||0)+(g.rd||0);
const elapsed=g=>Date.now()-((S.role==='host'&&ms(g.t0))||S.tq)-pre(g)*1000;
const stage=g=>{const e=elapsed(g),r=(g.rd||0)*1000;return e<-r?'cd':e<0?'rd':'go'};
const cdNum=g=>Math.max(1,Math.ceil((-elapsed(g)-(g.rd||0)*1000)/1000));
async function answer(a){
  const g=S.game,me=meNow();
  if(!g||!me||S.myAns!=null||g.rev||g.phase!=='play'||!g.cur||g.cur.aid===me.id||elapsed(g)<0||elapsed(g)>=(g.limit||20)*1000)return;
  const key=g.run+'_'+g.idx;S.myAns=a;sfx('lock');render();
  try{await ref(S.code).collection('answers').doc(key+'_'+me.id).set({k:key,p:me.id,name:me.name,a,ts:TS(),dt:Math.max(0,Date.now()-S.tq-pre(g)*1000)})}
  catch(e){S.myAns=null;fail('Je antwoord is niet aangekomen. Tik nog eens.')}
}
async function loadTaken(){
  if(S.role!=='player')return;
  try{const s=await ref(S.code).collection('questions').get();S.allQs={};s.forEach(d=>{S.allQs[d.id]=d.data()})}catch(e){}
}
function takenBy(){
  const me=meNow(),src=S.role==='host'?S.qs:S.allQs,t={};
  Object.keys(src||{}).forEach(id=>{const x=src[id];if(x&&x.topic&&(!me||id!==me.id))t[x.topic]=x.name});
  return t;
}
function collect(){
  const qs=[],fe=$('fe'),tp=$('tp')?$('tp').value:'';
  if(!tp){fe.textContent='Kies eerst je onderwerp, bovenaan het formulier.';return null}
  const tb=takenBy()[tp];
  if(tb){fe.textContent=`${tp} is al gekozen door ${tb}. Kies een ander onderwerp.`;return null}
  for(let i=0;i<PER;i++){
    const q=$('q'+i).value.trim(),o=[0,1,2,3].map(j=>$(`o${i}_${j}`).value.trim()),r=document.querySelector(`input[name="c${i}"]:checked`);
    if(!q||o.some(x=>!x)||!r){fe.textContent=`Vraag ${i+1} is nog niet af: vul de vraag, alle vier de antwoorden en het goede antwoord in.`;return null}
    qs.push({q,o,c:+r.value,img:S.imgs[i]||''});
  }
  qs.topic=tp;
  return qs;
}
async function submitQs(){
  await loadTaken();
  const qs=collect();if(!qs)return;
  const me=meNow(),data={name:me.name,topic:qs.topic,qs:qs.slice(),ts:Date.now()};
  if(JSON.stringify(data).length>900000){$('fe').textContent='De foto’s zijn samen te groot. Haal er een of twee weg.';return}
  try{
    await ref(S.code).collection('questions').doc(me.id).set(data);
    if(S.role==='player')S.mine=data;
    S.formOpen=false;S.err='';
  }catch(e){fail('Versturen mislukt. Controleer je verbinding en probeer opnieuw.');return}
  render();
}
function openForm(){
  const m=mineOf();S.imgs=(m?m.qs:[]).map(x=>x.img||'');S.formOpen=true;render();
  loadTaken().then(render);
}
function zoom(src){
  if(!src)return;
  const d=document.createElement('div');d.className='zoom';d.setAttribute('role','dialog');d.setAttribute('aria-label','Foto vergroot, tik om te sluiten');
  d.innerHTML=`<img src="${src}" alt=""><span aria-hidden="true">×</span>`;d.onclick=()=>d.remove();document.body.appendChild(d);
}
async function saveTopics(){
  const t=($('tpl').value||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(!t.length){fail('Vul minstens één onderwerp in.');return}
  try{await ref(S.code).update({topics:[...new Set(t)]});fail('Onderwerpen opgeslagen.')}catch(e){dbErr()}
}
function resize(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.62));
  };im.src=r.result};
  r.readAsDataURL(file);
}

function scrBeat(){if(S.view&&S.code)ref(S.code).update({scr:Date.now()}).catch(()=>{})}
function startTrial(){

  S.hostMe={id:'jij',name:'Jij'};S.formOpen=false;

function botsPlay(key){
  const g=S.game,[id,j]=g.order[g.idx].split('|'),q=S.qs[id]&&S.qs[id].qs[+j];if(!q)return;
  const lim=(g.limit||20)*1000,wait=pre(g)*1000;
  BOTS.forEach(([bid,name,skill])=>{
    const dt=1500+Math.random()*Math.min(lim*.55,9000);
    const a=Math.random()<skill?q.c:[0,1,2,3].filter(x=>x!==q.c)[Math.random()*3|0];
    setTimeout(()=>{
      if(!S.trial||S.curKey!==key||!S.game||S.game.rev)return;
      ref(S.code).collection('answers').doc(key+'_'+bid).set({k:key,p:bid,name,a,ts:Date.now(),dt}).catch(()=>{});
    },wait+dt);
  });
}
function setHostMe(name){
  name=(name||'').trim();if(!name){fail('Vul je naam in om mee te spelen.');return}
  S.hostMe={id:idOf(name),name};ls.set('pq-hostme',{code:S.code,name});
  ref(S.code).collection('players').doc(S.hostMe.id).set({name,seen:Date.now()},{merge:true}).catch(()=>{});render();
}
const curFor=(order,i)=>{
  const au=x=>x.split('|')[0],[id,j]=order[i].split('|'),q=S.qs[id].qs[+j];
  let rnd=0;for(let k=0;k<=i;k++)if(k===0||au(order[k])!==au(order[k-1]))rnd++;
  const first=i===0||au(order[i-1])!==id;
  return{n:i+1,tot:order.length,q:q.q,img:q.img||'',o:q.o,au:S.qs[id].name,aid:id,topic:S.qs[id].topic||'',rnd,rtot:new Set(order.map(au)).size,first,cd:first?5:3};
};
async function startQuiz(){
  const ids=Object.keys(S.qs);if(!ids.length)return;
  const lim=$('lim')?+$('lim').value:(S.game.limit||20),rd=$('rd')?+$('rd').value:(S.game.rd==null?3:S.game.rd);
  const order=[];shuffle(ids.slice()).forEach(id=>shuffle(S.qs[id].qs.map((_,j)=>j)).forEach(j=>order.push(id+'|'+j)));
  const scores={};
  if(!S.trial)ids.forEach(id=>{scores[id]={n:S.qs[id].name,s:0}});
  Object.keys(S.players).forEach(id=>{if(!scores[id])scores[id]={n:S.players[id].name,s:0}});
  try{await ref(S.code).update({phase:'play',run:(S.game.run||0)+1,idx:0,rev:false,c:-1,order,scores,gains:{},bon:{},streaks:{},sb:false,limit:lim,rd,t0:TS(),cur:curFor(order,0)})}catch(e){dbErr()}
}
function calcRound(g,got,q,t0){
  const lim=(g.limit||20)*1000,scores=cl(g.scores||{}),streaks=cl(g.streaks||{}),gains={},bon={};
  Object.values(got).forEach(a=>{if(!scores[a.p])scores[a.p]={n:a.name,s:0}});
  Object.keys(scores).forEach(p=>{
    if(p===g.cur.aid)return;
    const a=got[p];let gain=0,b=0;
    if(a){
      const t=ms(a.ts),raw=t!=null&&t0!=null?t-t0:(a.dt||0),dt=Math.min(Math.max(raw,0),lim);
      if(a.a===q.c&&raw<=lim+2000){
        streaks[p]=(streaks[p]||0)+1;
        b=Math.min(500,(streaks[p]-1)*100);
        gain=Math.round((1-dt/lim/2)*1000)+b;
      }else streaks[p]=0;
    }else streaks[p]=0;
    scores[p].s+=gain;gains[p]=gain;bon[p]=b;
  });
  return{scores,streaks,gains,bon};
}
async function revealQ(){
  const g=S.game;if(!g||g.rev||S.revealing)return;
  const [id,j]=g.order[g.idx].split('|');
  if(!S.qs[id]){fail('De vragen worden nog geladen. Probeer het zo opnieuw.');return}
  S.revealing=true;
  const q=S.qs[id].qs[+j],got={};Object.values(S.ans).forEach(a=>{got[a.p]=a});
  const r=calcRound(g,got,q,ms(g.t0)!=null?ms(g.t0)+pre(g)*1000:null);
  try{
    await DB.runTransaction(async tx=>{
      const snap=await tx.get(ref(S.code));
      if(snap.data().rev)return;
      tx.update(ref(S.code),{rev:true,c:q.c,gains:r.gains,bon:r.bon,streaks:r.streaks,scores:r.scores});
    });
  }catch(e){S.revealing=false;dbErr()}
}
async function showBoard(){
  try{await ref(S.code).update({sb:true})}catch(e){dbErr()}
}
async function nextQ(){
  const g=S.game,i=g.idx+1;
  if(i<g.order.length&&!S.qs[g.order[i].split('|')[0]]){fail('De vragen worden nog geladen. Probeer het zo opnieuw.');return}
  try{
    if(i>=g.order.length)await ref(S.code).update({phase:'done',rev:false,sb:false,c:-1});
    else await ref(S.code).update({idx:i,rev:false,sb:false,c:-1,gains:{},bon:{},t0:TS(),cur:curFor(g.order,i)});
  }catch(e){dbErr()}
}

    const arr=sorted(g.scores),rk=arr.findIndex(x=>x.id==='jij')+1;
    return h+`<section class="card" style="position:relative;overflow:hidden">${rk===1?confetti():''}<div class="result">${rk===1?'Gewonnen!':'Plek '+rk}</div><h2>Eindstand</h2><div class="endcols"><div>${podium(g.scores)}</div><div>${board(g.scores,'jij')}</div></div></section>
    <section class="card try"><h2>Zo werkt het met je vrienden</h2><ol><li>De quizmaster kiest Nieuwe quiz maken en deelt de code van vier letters.</li><li>Iedereen maakt in eigen tempo zeven vragen met vier antwoorden, desnoods weken van tevoren.</li><li>Op de quizavond start de quizmaster en antwoordt iedereen op de eigen telefoon.</li></ol></section>
    <div class="row"><button class="btn big" data-a="leave">Terug naar de start</button><button class="btn sec" data-a="start" style="color:var(--ivory)">Nog een keer</button></div>`;
  }
  const armBtn=S.view&&!S.armed?`<div class="row" style="justify-content:center"><button class="btn big" data-a="arm">Geluid en voorlezen aanzetten</button></div>`:'';
  if(S.view&&g.phase==='collect'){
    const ids=Object.keys(S.qs),link=location.origin+location.pathname+'?c='+S.code;
    const pls=Object.keys(S.players).filter(id=>!S.qs[id]);
    const tk=takenBy0(),tl=topicsOf(g);
    return h+armBtn+`<div class="cols"><section class="card" style="text-align:center"><div class="mut">Doe mee met code</div><div class="code">${esc(S.code)}</div>${qrSvg(link)}<p class="mut">of ga naar ${esc(link)}</p></section>
    <section class="card"><h2>Spelers (${ids.length+pls.length})</h2><div class="pills">${ids.map(id=>`<span class="pill">${esc(S.qs[id].name)} <small>${S.qs[id].topic?esc(S.qs[id].topic):''}</small></span>`).join('')}${pls.map(id=>`<span class="pill">${esc(S.players[id].name)}</span>`).join('')}</div>
    <h2 style="margin-top:18px">Onderwerpen</h2><div class="pills">${tl.map(t=>`<span class="pill"${tk[t]?'':' style="background:#e7e0c9;color:var(--ink)"'}>${esc(t)}</span>`).join('')}</div></section></div>
    ${ttsCard()}<p class="on-green">Dit is het grote scherm. De quizmaster start en bedient de quiz vanaf de eigen telefoon.</p>`;
  }
  if(g.phase==='collect'){
    const ids=Object.keys(S.qs),link=location.origin+location.pathname+'?c='+S.code,hm=S.hostMe;
    const pls=Object.keys(S.players).filter(id=>!S.qs[id]),np=ids.length+pls.length;
    const total=ids.reduce((n,id)=>n+S.qs[id].qs.length,0);
    h+=`<div class="cols"><section class="card" style="text-align:center"><div class="mut">Doe mee met code</div><div class="code">${esc(S.code)}</div>${qrSvg(link)}<p class="mut">of ga naar ${esc(link)}</p><div class="row" style="justify-content:center"><button class="btn sec" data-a="copy">Kopieer link</button></div></section>`;
    h+=`<section class="card"><h2>Spelers (${np})</h2>${np?`<div class="pills">${ids.map(id=>`<span class="pill">${esc(S.qs[id].name)} <small>${S.qs[id].topic?esc(S.qs[id].topic)+', ':''}${S.qs[id].qs.length} vragen</small><button class="x" data-a="delq" data-id="${id}" aria-label="Vragen van ${esc(S.qs[id].name)} verwijderen">×</button></span>`).join('')}${pls.map(id=>`<span class="pill">${esc(S.players[id].name)} <small>nog geen vragen</small></span>`).join('')}</div><p class="mut" style="margin-top:12px">${total} vragen in de pot, ongeveer ${Math.max(1,Math.round(total*45/60))} minuten spelen, inclusief aftellen en tussenstanden.</p>`:'<p class="mut">Nog niemand heeft vragen ingestuurd. Je mag deze pagina sluiten: de code blijft werken en de vragen blijven bewaard.</p>'}</section></div>`;
    const tk=takenBy0(),tl=topicsOf(g);
    h+=`<section class="card"><h2>Onderwerpen</h2><div class="pills">${tl.map(t=>`<span class="pill"${tk[t]?'':' style="background:#e7e0c9;color:var(--ink)"'}>${esc(t)} <small>${tk[t]?esc(tk[t]):'nog vrij'}</small></span>`).join('')}</div>
    <details style="margin-top:10px"><summary>Onderwerpen aanpassen</summary><p class="mut">Eén onderwerp per regel.</p><textarea id="tpl" rows="${Math.max(4,tl.length+1)}">${esc(tl.join('\n'))}</textarea><div class="row"><button class="btn sec" data-a="savetopics">Opslaan</button></div></details></section>`;
    const slink=location.origin+location.pathname+'?c='+S.code+'&scherm=1';
    h+=`<section class="card"><h2>Groot scherm</h2><p>Speel je zelf mee op je telefoon? Open dan deze link op de laptop of tv. Dat scherm toont de quiz groot, met geluid, muziek en voorlezen, en jij bedient alles vanaf je telefoon.</p><p class="mut" style="word-break:break-all">${esc(slink)}</p><div class="row"><button class="btn sec" data-a="copyscr">Kopieer link voor groot scherm</button>${scrOn()?'<span class="pill">Groot scherm verbonden</span>':''}</div></section>`;
    h+=ttsCard();
    h+=`<section class="card"><h2>Zelf meespelen</h2>${hm?`<p>Je speelt mee als <b>${esc(hm.name)}</b>. ${S.qs[hm.id]?'Je vragen staan erin.':'Je hebt nog geen vragen gemaakt.'}</p><div class="row"><button class="btn sec" data-a="editform">${S.qs[hm.id]?'Mijn vragen aanpassen':'Mijn vragen maken'}</button></div>`:`<p class="mut">Wil je zelf ook vragen maken en antwoorden op dit scherm?</p><label class="lab">Je naam<input id="hn" type="text" maxlength="20"></label><div class="row"><button class="btn sec" data-a="hostme">Ik speel mee</button></div>`}</section>`;
    return h+`<section class="card"><h2>Spelregels</h2><div class="row" style="margin:0"><label class="lab" style="margin:0">Tijd per vraag<select id="lim"><option value="10">10 seconden</option><option value="20" selected>20 seconden</option><option value="30">30 seconden</option><option value="60">60 seconden</option></select></label><label class="lab" style="margin:0">Leestijd<select id="rd"><option value="0">Geen</option><option value="3" selected>3 seconden</option><option value="5">5 seconden</option><option value="8">8 seconden</option></select></label></div><p class="mut">Net als bij Kahoot: een goed antwoord levert tot 1000 punten op. Direct antwoorden geeft 1000, in de laatste seconde 500. Meerdere goede antwoorden achter elkaar geven een reeksbonus, van +100 oplopend tot +500. Fout of te laat geeft 0 punten. De quiz gaat per onderwerp: eerst wordt het onderwerp aangekondigd, en elke vraag begint met aftellen, 3, 2, 1. Tijdens de leestijd staat alleen de vraag op het scherm. Wie de vraag heeft gemaakt, doet bij die vraag niet mee. Het antwoord wordt getoond zodra iedereen heeft geantwoord of de tijd om is.</p></section><div class="row" style="justify-content:flex-end"><button class="btn big" data-a="start"${ids.length?'':' disabled'}>Start de quiz</button></div><p class="on-green">Wie geen vragen maakt, kan toch meedoen met de code zodra de quiz loopt.</p>`;
  }
  if(g.phase==='done'){
    return h+`<section class="card stand" style="position:relative;overflow:hidden">${confetti()}<h2>Eindstand</h2><div class="endcols"><div>${podium(g.scores)}</div><div>${board(g.scores,hm0())}</div></div></section>${S.view?'':'<div class="row"><button class="btn" data-a="start">Nog een keer spelen</button><button class="btn sec" data-a="csv">Uitslag downloaden</button><button class="btn sec" data-a="leave">Quiz afsluiten</button></div>'}`;
  }
  const c=g.cur;if(!c)return h;
  h+=armBtn;
  if(g.rev&&g.sb){
    return h+`<section class="card stand"><div class="from">Na vraag ${c.n} van ${c.tot}${tchip(c)}</div><h2>Tussenstand</h2>${board(g.scores,hm0(),0,g.gains)}</section>${S.view?'':'<div class="row" style="justify-content:flex-end"><button class="btn big" data-a="next">Volgende vraag</button></div>'}`;
  }
  if(!g.rev&&stage(g)==='cd')return h+cdCard(g,S.hostMe&&c.aid===S.hostMe.id?'<p>Dit is jouw onderwerp. Bij deze vragen speel je niet mee.</p>':'');
  const hm=S.hostMe,rev=g.rev,answers=Object.values(S.ans),cnt=[0,0,0,0];
  answers.forEach(a=>{cnt[a.a]++});
  let opts;
  const reading=!rev&&elapsed(g)<0;
  if(reading)opts='<p class="mut">De antwoorden verschijnen zo…</p>';
  else if(hm&&!rev&&c.aid!==hm.id&&S.myAns==null)opts=optsBtn(c.o);
  else opts=optsStatic(c.o,rev?g.c:-1,rev?cnt:null)+(hm&&!rev&&c.aid!==hm.id?'<p class="mut">Jouw antwoord is vastgelegd.</p>':'');
  h+=`<section class="card"><div class="from">Vraag ${c.n} van ${c.tot}${tchip(c)}${S.trial?'':' · van '+esc(c.au)}</div>${rev?'':timerHtml(g)}<div class="q">${esc(c.q)}</div>${c.img?`<div class="qgrid"><div>${pic(c.img,!!hm)}</div><div>${opts}</div></div>`:opts}${hm&&c.aid===hm.id&&!rev?'<p class="mut">Deze vraag heb jij gemaakt, dus je speelt niet mee.</p>':''}</section>`;
  if(S.trial&&!rev&&c.n===1)h+=`<p class="on-green">Tik op het goede antwoord. Hoe sneller je goed antwoordt, hoe meer punten: tot 1000 per vraag.</p>`;
  const lastQ=c.n>=c.tot;
  let who='';
  if(rev){
    const al=answers.slice().sort((x,y)=>(y.a===g.c)-(x.a===g.c));
    who=`<span class="lbl">Antwoorden</span>${al.length?al.map(a=>`<span class="chipn ${a.a===g.c?'ok':'no'}${hm&&a.p===hm.id?' mine':''}">${esc(a.name)} ${SYM[a.a]}${a.a===g.c?' +'+((g.gains||{})[a.p]||0):''}</span>`).join(''):'<span class="chipn">Niemand heeft geantwoord</span>'}`;
    if(hm&&c.aid!==hm.id){const ok=S.myAns===g.c,gain=(g.gains||{})[hm.id]||0;who=`<span class="mres">${S.myAns==null?'Te laat':ok?'Goed! +'+gain:'Helaas'}</span>`+who}
  }else{
    const done=new Set(answers.map(a=>a.p)),ids=partIds(c.aid);
    answers.forEach(a=>{if(!ids.includes(a.p))ids.push(a.p)});
    const nm=id=>(S.players[id]&&S.players[id].name)||(hm&&hm.id===id?hm.name:'')||(S.ans[id]&&S.ans[id].name)||id;
    who=`<span class="lbl">Geantwoord ${answers.length} van ${expected()}</span>${ids.map(id=>`<span class="chipn${done.has(id)?' on':''}">${esc(nm(id))}</span>`).join('')}`;
  }
  const btns=S.view?'':rev?(lastQ?'<button class="btn big" data-a="next">Naar de eindstand</button>':'<button class="btn big" data-a="board">Tussenstand</button>'):'<button class="btn big" data-a="reveal">Toon antwoord</button>'+(S.trial?'':'<button class="btn sec" data-a="skipq" style="color:var(--ivory)">Vraag overslaan</button>');
  h+=`<div class="strip"><div class="who">${who}</div><div class="row">${btns}</div></div>`;
  return h;
}
const partIds=aid=>{
  const me=S.hostMe?S.hostMe.id:'';
  const ids=Object.keys(S.players).filter(id=>id!==aid&&(S.trial||id===me||(S.players[id].seen&&Date.now()-S.players[id].seen<45000)));
  if(me&&me!==aid&&!ids.includes(me))ids.push(me);
  return ids;
};
const expected=()=>{
  const g=S.game,aid=g&&g.cur?g.cur.aid:'',me=S.hostMe?S.hostMe.id:'';
  if(S.trial)return Object.keys(S.players).filter(id=>id!==aid).length;
  const n=Object.keys(S.players).filter(id=>id!==aid&&id!==me&&S.players[id].seen&&Date.now()-S.players[id].seen<45000).length;
  return n+(me&&me!==aid?1:0);
};
const hm0=()=>S.hostMe?S.hostMe.id:'';
const ttsCard=()=>{
  if(!hasTTS())return `<section class="card"><h2>Voorlezen</h2><p class="mut">Deze browser kan niet voorlezen. Gebruik bijvoorbeeld Chrome, Edge of Safari.</p></section>`;
  const where=!S.view&&scrOn()?'<p class="mut">Er is een groot scherm verbonden. Het voorlezen, de muziek en de geluiden komen daar vandaan; deze telefoon blijft stil.</p>':'';
  return `<section class="card"><h2>Voorlezen</h2><p>Het onderwerp van elke ronde en elke vraag worden voorgelezen. Stem: <b>${VOICE?esc(VOICE.name):'geen Nederlandse stem gevonden'}</b>${VOICE?'':', de standaardstem van dit apparaat wordt gebruikt'}.</p>${VOICE?'':'<p class="mut">Een Nederlandse stem zit standaard in Chrome, Edge en Safari. Op Windows kun je er een toevoegen via Instellingen, Tijd en taal, Spraak.</p>'}${where}<div class="row"><button class="btn sec" data-a="tts">${ttsOn()?'Voorlezen staat aan':'Voorlezen staat uit'}</button><button class="btn sec" data-a="ttstest">Test de stem</button></div></section>`;
};
const takenBy0=()=>{const t={};Object.keys(S.qs).forEach(id=>{const x=S.qs[id];if(x.topic)t[x.topic]=(t[x.topic]?t[x.topic]+' en ':'')+x.name});return t};
function view(){
  if(!DB)return `<div class="alert">De database is niet bereikbaar. Meedoen en een quiz maken lukt nu niet, de testquiz wel. Controleer je internetverbinding en ververs de pagina.</div>`+home();
  const b=DEMO&&!S.trial?'<div class="alert" style="background:var(--g7)">Voorbeeldmodus: niets wordt opgeslagen en alles verdwijnt bij verversen. Gebruik de code DEMO, als quizmaster of als speler.</div>':'';
  return b+(S.role==='host'?hostView():S.role==='player'?playerView():home());
}
function render(){
  const keep={},rad={},fo=document.activeElement&&document.activeElement.id;
  app.querySelectorAll('input[id],textarea[id],select[id]').forEach(e=>{keep[e.id]=e.value});
  app.querySelectorAll('input[type=radio]:checked').forEach(e=>{rad[e.name]=e.value});
  document.body.classList.toggle('host',S.role==='host');
  app.innerHTML=(S.err?`<div class="alert" role="alert">${esc(S.err)}</div>`:'')+view();
  Object.keys(keep).forEach(k=>{const e=$(k);if(e&&keep[k]&&e.type!=='file')e.value=keep[k]});
  Object.keys(rad).forEach(n=>{const e=app.querySelector(`input[name="${n}"][value="${rad[n]}"]`);if(e)e.checked=true});
  S.imgs.forEach((d,i)=>{const pv=$('pv'+i),dl=$('dl'+i);if(pv&&d){pv.src=d;pv.hidden=false;if(dl)dl.hidden=false}});
  if(fo&&$(fo)&&$(fo).focus){try{$(fo).focus();const l=$(fo).value.length;$(fo).setSelectionRange(l,l)}catch(e){}}
}

/* ---- events ---- */
document.addEventListener('click',e=>{
  ac();
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='join')join();
  else if(a==='newquiz')newQuiz();
  else if(a==='trial')startTrial();
  else if(a==='openhost')openHost(b.dataset.c);
  else if(a==='openhost2')openHost($('rc').value);
  else if(a==='leave'){if(!S.trial&&S.role==='host'&&S.game&&S.game.phase==='done')ls.del('pq-host');leave()}
  else if(a==='start')startQuiz();
  else if(a==='reveal')revealQ();
  else if(a==='next')nextQ();
  else if(a==='board')showBoard();
  else if(a==='copy')copyLink();
  else if(a==='copyscr'){const l=location.origin+location.pathname+'?c='+S.code+'&scherm=1';(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>fail('Link voor het grote scherm gekopieerd.')).catch(()=>fail('Kopiëren lukte niet. Neem de link hierboven over.'))}
  else if(a==='openscreen'){arm();openHost($('rc').value,true)}
  else if(a==='arm'){arm();render()}
  else if(a==='tts'){ls.set('pq-tts',!ttsOn());if(!ttsOn()&&hasTTS())speechSynthesis.cancel();render()}
  else if(a==='ttstest'){arm();say('Welkom bij de pubquiz. Ronde één: FC Groningen.',true)}
  else if(a==='snd'){ls.set(sndKey(),!sndOn());if(!sndOn()&&hasTTS())speechSynthesis.cancel();sfx('lock');render()}
  else if(a==='fs'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}}
  else if(a==='csv')csv();
  else if(a==='delq')delQs(b.dataset.id);
  else if(a==='skipq'){if(confirm('Deze vraag overslaan? Er worden geen punten uitgedeeld.'))nextQ()}
  else if(a==='ans')answer(+b.dataset.i);
  else if(a==='submit')submitQs();
  else if(a==='skip'){S.skip=true;S.formOpen=false;render()}
  else if(a==='editform')openForm();
  else if(a==='closeform'){S.formOpen=false;render()}
  else if(a==='hostme')setHostMe($('hn').value);
  else if(a==='zoom')zoom(b.getAttribute('src'));
  else if(a==='savetopics')saveTopics();
  else if(a==='delimg'){const i=+b.dataset.i;S.imgs[i]='';const pv=$('pv'+i),fi=$('fi'+i);if(pv){pv.hidden=true;pv.removeAttribute('src')}if(fi)fi.value='';b.hidden=true}
});
document.addEventListener('change',e=>{
  const t=e.target,i=t.dataset&&t.dataset.f;
  if(i==null||!t.files||!t.files[0])return;
  resize(t.files[0],d=>{S.imgs[+i]=d;const pv=$('pv'+i),dl=$('dl'+i);if(pv){pv.src=d;pv.hidden=false}if(dl)dl.hidden=false});
});
let tickN=0;
setInterval(()=>{
  tickN++;
  const g=S.game;
  if(S.view&&tickN%60===0)scrBeat();
  {let want=false;if(g&&g.phase==='play'&&g.cur&&!g.rev&&S.role==='host'){const e=elapsed(g);want=e>=0&&e<(g.limit||20)*1000}musicSync(want)}
  if(!g||g.phase!=='play'||!g.cur)return;
  if((S.role==='player'||(S.role==='host'&&S.hostMe))&&tickN%60===0)beat();
  if(g.rev)return;
  const lim=(g.limit||20)*1000,el=elapsed(g);
  const tm=$('tm'),tb=$('tb');
  const st=stage(g),sk=st+(st==='cd'?cdNum(g):'');
  if(sk!==S.stKey){
    const prev=S.stKey||'';S.stKey=sk;
    if(st==='cd'){const n=cdNum(g);if(prev===''&&g.cur.first){sfx('join');say(g.cur.topic?`Ronde ${g.cur.rnd}. ${g.cur.topic}.`:`Ronde ${g.cur.rnd}.`)}if(n<=3)sfx('tick')}
    else if(prev.startsWith('cd')){sfx('start');say(g.cur.q)}
    render();
  }
  const left=Math.ceil((lim-el)/1000);
  if(el>=0&&left<=5&&left>=1&&left!==S.lastTick){S.lastTick=left;sfx('tick')}
  if(tm)tm.textContent=Math.max(0,Math.ceil((lim-el)/1000));
  if(tb)tb.style.width=Math.max(0,(1-el/lim)*100)+'%';
  document.querySelectorAll('[data-a=ans]').forEach(b=>{b.disabled=el>=lim});
  if(S.role==='host'&&!S.revealing){
    const ex=expected();
    if(el>=lim+1500||(ex>0&&Object.keys(S.ans).length>=ex&&el>800))revealQ();
  }
},250);
document.addEventListener('pointerdown',()=>{if(!S.armed)arm()},true);
document.addEventListener('fullscreenchange',()=>render());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
render();
{const u=new URLSearchParams(location.search),c=u.get('c');if(c&&u.has('scherm'))openHost(c,true)}
})();
</script>
</body>
</html>
