<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10352a">
<title>Pubquiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--g9:#0a251d;--g8:#10352a;--g7:#194a3b;--brass:#d6ae55;--brass2:#a8832f;--ivory:#f3eedf;--ink:#18211c;--mut:#5d6a62;--line:#d8d0b8;
--o0:#b93a26;--o1:#2a5fa8;--o2:#96660a;--o3:#277a52;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ivory);font:400 17px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
background:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px) 0 0/100% 38px,var(--g8);min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
h1,h2,.slab{font-family:"Alfa Slab One",Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.01em}
h2{font-size:1.35rem;margin:0 0 .6rem}
.sign{border:3px double var(--brass);border-radius:4px;padding:22px 18px;margin:12px 0 18px;text-align:center;background:var(--g9);box-shadow:0 0 0 6px var(--g8),0 0 0 8px var(--brass2)}
.sign h1{margin:0;font-size:clamp(2.4rem,9vw,4.2rem);line-height:1;color:var(--brass)}
.sign p{margin:.6rem 0 0;color:var(--ivory);opacity:.85}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0 12px}
.logo{font-family:"Alfa Slab One",Georgia,serif;color:var(--brass);font-size:1.3rem}
.chip{border:1px solid var(--brass2);color:var(--brass);border-radius:99px;padding:2px 12px;font-weight:600}
.lnk{background:none;border:0;color:var(--ivory);opacity:.8;text-decoration:underline;font:inherit;cursor:pointer;padding:8px}
.card{background:var(--ivory);color:var(--ink);border-radius:10px;padding:18px;margin:14px 0}
.card .mut,.mut{color:var(--mut);font-size:.95rem}
.on-green{color:var(--ivory);opacity:.8}
.lab{display:block;font-weight:600;margin:10px 0}
input[type=text],textarea{display:block;width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;margin-top:5px}
textarea{resize:vertical}
select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:5px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--brass2);outline-offset:2px}
.btn{font:700 1rem Figtree,system-ui,sans-serif;background:var(--brass);color:var(--ink);border:0;border-radius:8px;padding:13px 20px;cursor:pointer;min-height:48px}
.btn:hover{background:#e2bd68}
.btn.sec{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.15rem;padding:16px 28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
details{margin-top:14px}summary{cursor:pointer;color:var(--mut)}
.alert{background:#7a1f12;color:#fff;border-radius:8px;padding:12px 14px;margin:8px 0}
.code{font-family:"Alfa Slab One",Georgia,serif;font-size:clamp(3rem,14vw,6rem);letter-spacing:.14em;color:var(--brass);text-align:center;line-height:1.1;margin:.2em 0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--g8);color:var(--ivory);border-radius:99px;padding:4px 14px;font-weight:600}
.pill small{opacity:.7;font-weight:400}
.q{font-weight:700;font-size:clamp(1.3rem,3.4vw,2.2rem);line-height:1.25;margin:.2em 0 .4em}
.from{color:var(--mut);font-size:.95rem}
img.pic{display:block;max-width:100%;max-height:min(46vh,380px);border-radius:8px;margin:10px auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:.7em;align-items:center;color:#fff;border:0;border-radius:8px;padding:1em 1.1em;min-height:68px;font:700 clamp(1.05rem,2.3vw,1.6rem) Figtree,system-ui,sans-serif;text-align:left;word-break:break-word}
button.opt{cursor:pointer}
.opt .s{font-size:1.2em;opacity:.9;flex:none}
.o0{background:var(--o0)}.o1{background:var(--o1)}.o2{background:var(--o2)}.o3{background:var(--o3)}
.opt.dim{opacity:.3}
.opt.win{outline:5px solid var(--brass);outline-offset:2px}
.sc{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.sc:first-of-type{border-top:0}
.ok{color:#1d7a46;font-weight:700}.no{color:#a33322;font-weight:700}
.result{font-family:"Alfa Slab One",Georgia,serif;font-size:2rem;margin:.2em 0}
.board{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.board li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center}
.board .rk{font-family:"Alfa Slab One",Georgia,serif;font-size:1.2rem;text-align:center;color:var(--brass2)}
.board .nm{position:relative;display:block;padding:8px 12px;font-weight:700;overflow:hidden;border-radius:6px;background:#e7e0c9;z-index:0}
.board .nm i{position:absolute;inset:0 auto 0 0;background:var(--brass);opacity:.55;z-index:-1;animation:grow .7s ease-out both;transform-origin:left}
.board b{font-family:"Alfa Slab One",Georgia,serif;font-size:1.2rem;min-width:3ch;text-align:right}
.board li.me .nm{outline:3px solid var(--g7)}
.board li:first-child .nm{font-size:1.25rem;padding:12px}
.tline{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.timer{font-family:"Alfa Slab One",Georgia,serif;font-size:1.8rem;color:var(--ink);background:var(--brass);border-radius:50%;width:3.2rem;height:3.2rem;display:grid;place-items:center;flex:none}
.tbar{flex:1;height:12px;background:#e7e0c9;border-radius:6px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--o3)}
.cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:99px;padding:0 .7em}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0 10px}
.pd{flex:1;max-width:210px;text-align:center}
.pd .who{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.pd .blk{background:var(--brass);color:var(--ink);border-radius:8px 8px 0 0;font-family:"Alfa Slab One",Georgia,serif;font-size:2rem;padding-top:.25em}
.pd small{display:block;color:var(--mut)}
button.opt:disabled{opacity:.35;cursor:not-allowed}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qf{border:0;border-top:1px solid var(--line);margin:14px 0 0;padding:12px 0 0}
.qf legend{font-weight:700;padding:0;margin-bottom:6px}
.ansrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.ansrow input[type=radio]{width:22px;height:22px;accent-color:var(--g7);flex:none}
.ansrow .sym{width:22px;text-align:center;color:var(--ink);flex:none}
.ansrow input[type=text]{margin:0}
.s0{color:var(--o0)!important}.s1{color:var(--o1)!important}.s2{color:var(--o2)!important}.s3{color:var(--o3)!important}
.file{display:inline-block;margin:8px 0 0;color:var(--g7);font-weight:600}
.file input{display:block;margin-top:4px;font:inherit}
.fe{color:#a33322;font-weight:600;margin:10px 0 0}
.wait{text-align:center;padding:26px 10px}
.wait .big{font-size:2.4rem}
@media(prefers-reduced-motion:reduce){.board .nm i{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
(()=>{
/* ---- Firebase ---- */
const FB={apiKey:"AIzaSyA2rK-0SlzxjDjPek-Y2ojCV0dSdVOniCo",authDomain:"pubquiz-e1f69.firebaseapp.com",projectId:"pubquiz-e1f69",storageBucket:"pubquiz-e1f69.firebasestorage.app",messagingSenderId:"1062523724044",appId:"1:1062523724044:web:09d895d25c0f042aaf6929"};
const app=document.getElementById('app');
const DEMO=/[?&]demo\b/.test(location.search)||!/^https?:$/.test(location.protocol);
const PFX=DEMO?'demo-':'';
function memDB(){
  const store={},subs=[];
  const cl=x=>JSON.parse(JSON.stringify(x));
  const snap=p=>({exists:p in store,id:p.split('/').pop(),data:()=>cl(store[p])});
  const notify=()=>subs.slice().forEach(s=>s());
  const sub=run=>{subs.push(run);setTimeout(run,0);return()=>{const i=subs.indexOf(run);if(i>=0)subs.splice(i,1)}};
  const docRef=p=>({
    get:async()=>snap(p),
    set:async (d,o)=>{store[p]=o&&o.merge?Object.assign({},store[p],cl(d)):cl(d);notify()},
    update:async d=>{store[p]=Object.assign({},store[p],cl(d));notify()},
    onSnapshot:fn=>sub(()=>fn(snap(p))),
    collection:n=>colRef(p+'/'+n)
  });
  const colRef=(p,flt)=>({
    doc:id=>docRef(p+'/'+id),
    where:(f,o,v)=>colRef(p,d=>d[f]===v),
    onSnapshot:fn=>sub(()=>{
      const n=p.split('/').length+1;
      const docs=Object.keys(store).filter(k=>k.startsWith(p+'/')&&k.split('/').length===n&&(!flt||flt(store[k]))).map(snap);
      fn({forEach:f=>docs.forEach(f)});
    })
  });
  const db={collection:n=>colRef(n),runTransaction:async f=>f({get:r=>r.get(),update:(r,d)=>r.update(d)})};
  const Q=[
    ['Anna',[['Wat is de hoofdstad van Australië?',['Sydney','Melbourne','Canberra','Perth'],2],['Hoeveel poten heeft een spin?',['6','8','10','12'],1]]],
    ['Bram',[['Welke kleur krijg je door blauw en geel te mengen?',['Groen','Paars','Oranje','Bruin'],0],['Hoe heet de hoogste berg ter wereld?',['K2','Mount Everest','Mont Blanc','Kilimanjaro'],1]]],
    ['Chloe',[['In welk jaar begon de Eerste Wereldoorlog?',['1904','1914','1918','1939'],1],['Welk element heeft symbool O?',['Goud','Osmium','Zuurstof','IJzer'],2]]]
  ];
  store['games/DEMO']={phase:'collect',run:0,idx:0,rev:false,c:-1,scores:{},gains:{},created:Date.now()};
  Q.forEach(([n,qs])=>{store['games/DEMO/questions/'+n.toLowerCase()]={name:n,ts:Date.now(),qs:qs.map(([q,o,c])=>({q,o,c,img:''}))}});
  return db;
}
let DB=null;
if(DEMO)DB=memDB();
else try{firebase.initializeApp(FB);DB=firebase.firestore()}catch(e){}

/* ---- helpers ---- */
const PER=5,SYM=['▲','◆','●','■'],LET=['A','B','C','D'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idOf=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,30)||'speler';
const mkCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ';return Array.from({length:4},()=>a[Math.random()*a.length|0]).join('')};
const ref=c=>DB.collection('games').doc(c);
const ls={get(k){try{return JSON.parse(localStorage.getItem(PFX+k))}catch(e){return null}},set(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(PFX+k)}catch(e){}}};
const okImg=s=>typeof s==='string'&&s.startsWith('data:image/jpeg;base64,')&&s.length<400000?s:'';
const ms=v=>v&&v.toMillis?v.toMillis():(typeof v==='number'?v:null);
const TS=()=>DEMO?Date.now():firebase.firestore.FieldValue.serverTimestamp();
const cl=x=>JSON.parse(JSON.stringify(x));
const SNAP={serverTimestamps:'estimate'};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---- state ---- */
const S={players:{},revealing:false,role:'home',code:'',me:null,hostMe:null,game:null,qs:{},ans:{},mine:null,skip:false,formOpen:false,imgs:[],myAns:null,tq:0,curKey:'',err:'',unsubs:[],ansUnsub:null,busy:false};
let errT=null;
const fail=m=>{S.err=m;render();clearTimeout(errT);errT=setTimeout(()=>{S.err='';render()},7000)};
const dbErr=()=>fail('Geen toegang tot de database. Controleer de Firestore-regels en je verbinding.');
const meNow=()=>S.role==='player'?S.me:S.hostMe;
const mineOf=()=>S.role==='player'?S.mine:(S.hostMe?S.qs[S.hostMe.id]||null:null);
const sy=i=>`<span class="s">${SYM[i]}</span>`;
let wl=null;
const wake=()=>{try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(l=>{wl=l}).catch(()=>{})}catch(e){}};

/* ---- realtime ---- */
function unwatch(){S.unsubs.forEach(f=>f());S.unsubs=[];if(S.ansUnsub){S.ansUnsub();S.ansUnsub=null}S.ans={};S.curKey='';S.myAns=null}
function watchGame(){
  unwatch();
  S.unsubs.push(ref(S.code).onSnapshot(s=>{S.game=s.exists?s.data(SNAP):null;onGame();render()},dbErr));
  if(S.role==='host')S.unsubs.push(ref(S.code).collection('players').onSnapshot(s=>{S.players={};s.forEach(d=>{S.players[d.id]=d.data()});render()},dbErr));
  if(S.role==='host')S.unsubs.push(ref(S.code).collection('questions').onSnapshot(s=>{S.qs={};s.forEach(d=>{S.qs[d.id]=d.data()});render()},dbErr));
}
function onGame(){
  const g=S.game;if(!g)return;
  const key=g.phase==='play'?g.run+'_'+g.idx:'';
  if(key===S.curKey)return;
  S.curKey=key;S.myAns=null;S.tq=Date.now();S.revealing=false;
  if(S.ansUnsub){S.ansUnsub();S.ansUnsub=null;S.ans={}}
  if(!key)return;
  if(S.role==='host')S.ansUnsub=ref(S.code).collection('answers').where('k','==',key).onSnapshot(s=>{S.ans={};s.forEach(d=>{const x=d.data(SNAP);S.ans[x.p]=x});render()},dbErr);
  const me=meNow();
  if(me)ref(S.code).collection('answers').doc(key+'_'+me.id).get().then(d=>{if(d.exists&&S.curKey===key){S.myAns=d.data().a;render()}}).catch(()=>{});
}
function leave(){unwatch();S.players={};S.revealing=false;S.role='home';S.game=null;S.qs={};S.mine=null;S.me=null;S.hostMe=null;S.skip=false;S.formOpen=false;S.code='';S.err='';render()}

/* ---- player ---- */
async function join(){
  const code=$('jc').value.trim().toUpperCase(),name=$('jn').value.trim();
  if(!code||!name){fail('Vul de code en je naam in.');return}
  try{
    const g=await ref(code).get();
    if(!g.exists){fail('Deze code bestaat niet. Controleer de code of vraag de quizmaster om een nieuwe.');return}
    const id=idOf(name),q=await ref(code).collection('questions').doc(id).get();
    S.role='player';S.code=code;S.me={id,name};S.mine=q.exists?q.data():null;S.skip=false;
    S.formOpen=!S.mine&&g.data().phase==='collect';
    S.imgs=(S.mine?S.mine.qs:[]).map(x=>x.img||'');
    ls.set('pq-me',{code,name});wake();beat();watchGame();render();
  }catch(e){dbErr()}
}
function beat(){
  const me=S.role==='player'?S.me:null;if(!me||!S.code)return;
  ref(S.code).collection('players').doc(me.id).set({name:me.name,seen:Date.now()},{merge:true}).catch(()=>{});
}
const elapsed=g=>Date.now()-((S.role==='host'&&ms(g.t0))||S.tq);
async function answer(a){
  const g=S.game,me=meNow();
  if(!g||!me||S.myAns!=null||g.rev||g.phase!=='play'||elapsed(g)>=(g.limit||20)*1000)return;
  const key=g.run+'_'+g.idx;S.myAns=a;render();
  try{await ref(S.code).collection('answers').doc(key+'_'+me.id).set({k:key,p:me.id,name:me.name,a,ts:TS(),dt:Math.max(0,Date.now()-S.tq)})}
  catch(e){S.myAns=null;fail('Je antwoord is niet aangekomen. Tik nog eens.')}
}
function collect(){
  const qs=[],fe=$('fe');
  for(let i=0;i<PER;i++){
    const q=$('q'+i).value.trim(),o=[0,1,2,3].map(j=>$(`o${i}_${j}`).value.trim()),r=document.querySelector(`input[name="c${i}"]:checked`);
    if(!q||o.some(x=>!x)||!r){fe.textContent=`Vraag ${i+1} is nog niet af: vul de vraag, alle vier de antwoorden en het goede antwoord in.`;return null}
    qs.push({q,o,c:+r.value,img:S.imgs[i]||''});
  }
  return qs;
}
async function submitQs(){
  const qs=collect();if(!qs)return;
  const me=meNow(),data={name:me.name,qs,ts:Date.now()};
  if(JSON.stringify(data).length>900000){$('fe').textContent='De foto’s zijn samen te groot. Haal er een of twee weg.';return}
  try{
    await ref(S.code).collection('questions').doc(me.id).set(data);
    if(S.role==='player')S.mine=data;
    S.formOpen=false;S.err='';
  }catch(e){fail('Versturen mislukt. Controleer je verbinding en probeer opnieuw.');return}
  render();
}
function openForm(){
  const m=mineOf();S.imgs=(m?m.qs:[]).map(x=>x.img||'');S.formOpen=true;render();
}
function resize(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6));
  };im.src=r.result};
  r.readAsDataURL(file);
}

/* ---- host ---- */
async function newQuiz(){
  if(!DB){dbErr();return}
  try{
    let c='';
    for(let i=0;i<6;i++){c=mkCode();if(!(await ref(c).get()).exists)break}
    await ref(c).set({phase:'collect',run:0,idx:0,rev:false,c:-1,scores:{},gains:{},created:Date.now()});
    beginHost(c);
  }catch(e){dbErr()}
}
async function openHost(code){
  code=(code||'').trim().toUpperCase();if(!code)return;
  try{
    const g=await ref(code).get();
    if(!g.exists){fail('Deze code bestaat niet.');return}
    beginHost(code);
  }catch(e){dbErr()}
}
function beginHost(code){
  S.role='host';S.code=code;S.qs={};ls.set('pq-host',code);
  const hm=ls.get('pq-hostme');S.hostMe=hm&&hm.code===code?{id:idOf(hm.name),name:hm.name}:null;
  wake();watchGame();render();
}
function setHostMe(name){
  name=(name||'').trim();if(!name){fail('Vul je naam in om mee te spelen.');return}
  S.hostMe={id:idOf(name),name};ls.set('pq-hostme',{code:S.code,name});
  ref(S.code).collection('players').doc(S.hostMe.id).set({name,seen:Date.now()},{merge:true}).catch(()=>{});render();
}
const curFor=(order,i)=>{const [id,j]=order[i].split('|'),q=S.qs[id].qs[+j];return{n:i+1,tot:order.length,q:q.q,img:q.img||'',o:q.o,au:S.qs[id].name,aid:id}};
async function startQuiz(){
  const ids=Object.keys(S.qs);if(!ids.length)return;
  const lim=$('lim')?+$('lim').value:(S.game.limit||20);
  const order=[];ids.forEach(id=>S.qs[id].qs.forEach((_,j)=>order.push(id+'|'+j)));shuffle(order);
  const scores={};
  ids.forEach(id=>{scores[id]={n:S.qs[id].name,s:0}});
  Object.keys(S.players).forEach(id=>{if(!scores[id])scores[id]={n:S.players[id].name,s:0}});
  try{await ref(S.code).update({phase:'play',run:(S.game.run||0)+1,idx:0,rev:false,c:-1,order,scores,gains:{},bon:{},streaks:{},limit:lim,t0:TS(),cur:curFor(order,0)})}catch(e){dbErr()}
}
function calcRound(g,got,q,t0){
  const lim=(g.limit||20)*1000,scores=cl(g.scores||{}),streaks=cl(g.streaks||{}),gains={},bon={};
  Object.values(got).forEach(a=>{if(!scores[a.p])scores[a.p]={n:a.name,s:0}});
  Object.keys(scores).forEach(p=>{
    if(p===g.cur.aid)return;
    const a=got[p];let gain=0,b=0;
    if(a){
      const t=ms(a.ts),raw=t!=null&&t0!=null?t-t0:(a.dt||0),dt=Math.min(Math.max(raw,0),lim);
      if(a.a===q.c&&raw<=lim+2000){
        streaks[p]=(streaks[p]||0)+1;
        b=Math.min(500,(streaks[p]-1)*100);
        gain=Math.round((1-dt/lim/2)*1000)+b;
      }else streaks[p]=0;
    }else streaks[p]=0;
    scores[p].s+=gain;gains[p]=gain;bon[p]=b;
  });
  return{scores,streaks,gains,bon};
}
async function revealQ(){
  const g=S.game;if(!g||g.rev||S.revealing)return;
  const [id,j]=g.order[g.idx].split('|');
  if(!S.qs[id]){fail('De vragen worden nog geladen. Probeer het zo opnieuw.');return}
  S.revealing=true;
  const q=S.qs[id].qs[+j],got={};Object.values(S.ans).forEach(a=>{got[a.p]=a});
  const r=calcRound(g,got,q,ms(g.t0));
  try{
    await DB.runTransaction(async tx=>{
      const snap=await tx.get(ref(S.code));
      if(snap.data().rev)return;
      tx.update(ref(S.code),{rev:true,c:q.c,gains:r.gains,bon:r.bon,streaks:r.streaks,scores:r.scores});
    });
  }catch(e){S.revealing=false;dbErr()}
}
async function nextQ(){
  const g=S.game,i=g.idx+1;
  if(i<g.order.length&&!S.qs[g.order[i].split('|')[0]]){fail('De vragen worden nog geladen. Probeer het zo opnieuw.');return}
  try{
    if(i>=g.order.length)await ref(S.code).update({phase:'done',rev:false,c:-1});
    else await ref(S.code).update({idx:i,rev:false,c:-1,gains:{},bon:{},t0:TS(),cur:curFor(g.order,i)});
  }catch(e){dbErr()}
}
async function copyLink(){
  const l=location.origin+location.pathname+'?c='+S.code;
  try{await navigator.clipboard.writeText(l);fail('Link gekopieerd.')}catch(e){fail(l)}
}

/* ---- views ---- */
const sign=()=>`<header class="sign"><h1>Pubquiz</h1><p>Iedereen maakt vragen. Daarna spelen jullie ze samen.</p></header>`;
const topbar=()=>`<div class="bar"><span class="logo">Pubquiz</span><span class="chip">Code ${esc(S.code)}</span><button class="lnk" data-a="leave">Stoppen</button></div>`;
const sorted=sc=>Object.entries(sc||{}).map(([id,v])=>({id,n:v.n,s:v.s})).sort((x,y)=>y.s-x.s);
const podium=sc=>{
  const a=sorted(sc),cols=[[a[1],110,2],[a[0],150,1],[a[2],80,3]].filter(c=>c[0]);
  return `<div class="podium">${cols.map(([x,h,r])=>`<div class="pd"><div class="who">${esc(x.n)}</div><small>${x.s} punten</small><div class="blk" style="height:${h}px">${r}</div></div>`).join('')}</div>`;
};
const board=(sc,me,top)=>{
  const a=sorted(sc).slice(0,top||99),mx=Math.max(1,...a.map(x=>x.s));
  return `<ol class="board">${a.map((x,i)=>`<li class="${x.id===me?'me':''}"><span class="rk">${i+1}</span><span class="nm">${esc(x.n)}<i style="width:${Math.round(x.s/mx*100)}%"></i></span><b>${x.s}</b></li>`).join('')}</ol>`;
};
const optsStatic=(o,c,cnt)=>`<div class="opts">${o.map((t,i)=>`<div class="opt o${i}${c>=0&&i!==c?' dim':''}${c===i?' win':''}">${sy(i)}<span>${esc(t)}</span>${cnt?`<b class="cnt">${cnt[i]}</b>`:''}</div>`).join('')}</div>`;
const optsBtn=o=>`<div class="opts">${o.map((t,i)=>`<button class="opt o${i}" data-a="ans" data-i="${i}">${sy(i)}<span>${esc(t)}</span></button>`).join('')}</div>`;
const timerHtml=g=>{const lim=(g.limit||20)*1000,el=Math.min(lim,Math.max(0,elapsed(g)));return `<div class="tline"><span class="timer" id="tm">${Math.ceil((lim-el)/1000)}</span><div class="tbar"><i id="tb" style="width:${Math.round((1-el/lim)*100)}%"></i></div></div>`};
const pic=s=>s?`<img class="pic" src="${s}" alt="">`:'';

function home(){
  const qc=(new URLSearchParams(location.search).get('c')||'').toUpperCase(),sv=ls.get('pq-me')||{},hc=ls.get('pq-host');
  return `${sign()}
  <section class="card"><h2>Meedoen</h2>
    <label class="lab">Code van de quiz<input id="jc" type="text" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(qc||sv.code||(DEMO?'DEMO':''))}"></label>
    <label class="lab">Je naam<input id="jn" type="text" maxlength="20" autocomplete="nickname" value="${esc(sv.name||'')}"></label>
    <div class="row"><button class="btn" data-a="join">Doe mee</button></div>
    <p class="mut">Je kunt je vragen invullen wanneer het jou uitkomt. Doe later opnieuw mee met dezelfde code en naam om ze aan te passen.</p>
  </section>
  <section class="card"><h2>Quizmaster</h2>
    ${hc?`<p>Je hebt nog een quiz open met code <b>${esc(hc)}</b>.</p><div class="row"><button class="btn" data-a="openhost" data-c="${esc(hc)}">Verder als quizmaster</button></div><hr>`:''}
    <div class="row"><button class="btn${hc?' sec':''}" data-a="newquiz">Nieuwe quiz maken</button></div>
    <details><summary>Quiz openen met een andere code</summary><div class="row"><input id="rc" type="text" maxlength="4" placeholder="Code" autocapitalize="characters" style="max-width:9em;margin:0"><button class="btn sec" data-a="openhost2">Openen</button></div></details>
  </section>${DEMO?'':'<p class="on-green" style="text-align:center"><a href="?demo=1" style="color:var(--brass)">Bekijk een voorbeeld zonder database</a></p>'}`;
}
function form(){
  const me=meNow(),pre=(mineOf()||{}).qs||[];
  let h=`<section class="card"><h2>Maak je ${PER} vragen, ${esc(me.name)}</h2><p class="mut">Elke vraag heeft vier antwoorden. Kies het goede met het bolletje. Een foto is optioneel.</p>`;
  for(let i=0;i<PER;i++){
    const p=pre[i]||{};
    h+=`<fieldset class="qf"><legend>Vraag ${i+1}</legend><textarea id="q${i}" rows="2" placeholder="Stel je vraag">${esc(p.q)}</textarea>
    <label class="file">Foto toevoegen<input type="file" accept="image/*" data-f="${i}"></label><img class="pic" id="pv${i}" alt="" hidden>
    ${[0,1,2,3].map(j=>`<label class="ansrow"><input type="radio" name="c${i}" value="${j}"${p.c===j?' checked':''}><span class="sym s${j}">${SYM[j]}</span><input type="text" id="o${i}_${j}" placeholder="Antwoord ${LET[j]}" value="${esc((p.o||[])[j])}"></label>`).join('')}</fieldset>`;
  }
  return h+`<p class="fe" id="fe" role="alert"></p><div class="row"><button class="btn" data-a="submit">Vragen opslaan</button>${mineOf()?'<button class="btn sec" data-a="closeform">Annuleren</button>':(S.role==='player'?'<button class="btn sec" data-a="skip">Alleen meespelen</button>':'')}</div></section>`;
}
function playerView(){
  const g=S.game,me=S.me;
  if(!g)return `${topbar()}<div class="card">Deze quiz bestaat niet meer.</div>`;
  let h=`${topbar()}`;
  if(g.phase==='collect'){
    if(S.formOpen)return h+form();
    return h+`<section class="card wait"><div class="slab big">${S.mine?'Je vragen staan erin':'Je doet mee'}</div><p>${S.mine?`Dank, ${esc(me.name)}. Zodra de quizmaster start, verschijnt de eerste vraag hier vanzelf.`:'Wacht tot de quizmaster de quiz start.'}</p><div class="row" style="justify-content:center"><button class="btn sec" data-a="editform">${S.mine?'Mijn vragen aanpassen':'Toch vragen maken'}</button></div></section>`;
  }
  if(g.phase==='done'){
    const arr=sorted(g.scores),rk=arr.findIndex(x=>x.id===me.id)+1;
    return h+`<section class="card">${rk?`<div class="result">Plek ${rk}</div><p class="mut">${arr[rk-1].s} punten</p>`:''}<h2>Eindstand</h2>${board(g.scores,me.id,8)}</section>`;
  }
  const c=g.cur;if(!c)return h;
  h+=`<section class="card"><div class="from">Vraag ${c.n} van ${c.tot}</div><div class="q">${esc(c.q)}</div>${pic(c.img)}</section>`;
  if(c.aid===me.id)return h+`<section class="card wait"><div class="slab big">Jouw vraag</div><p>Je doet bij deze vraag niet mee. Kijk maar hoe de rest het doet.</p></section>`;
  if(g.rev){
    const gain=(g.gains||{})[me.id]||0,b=(g.bon||{})[me.id]||0,st=(g.streaks||{})[me.id]||0,ok=S.myAns===g.c;
    const arr=sorted(g.scores),rk=arr.findIndex(x=>x.id===me.id)+1,mine=rk?arr[rk-1].s:0,lead=arr[0];
    const pos=rk?(rk===1?'Je staat bovenaan.':`Plek ${rk}, ${lead.s-mine} punten achter ${esc(lead.n)}.`):'';
    return h+`<section class="card"><div class="result ${ok?'ok':'no'}">${S.myAns==null?'Te laat':ok?'Goed! +'+gain:'Helaas'}</div>${ok&&st>=2?`<p class="ok">Reeks van ${st} goed: bonus +${b}</p>`:''}<p>Het goede antwoord was <b>${LET[g.c]}. ${esc(c.o[g.c])}</b>.</p><p class="mut">Jouw score: ${mine}. ${pos}</p></section>`;
  }
  if(S.myAns!=null)return h+`<section class="card wait"><div class="slab big">${SYM[S.myAns]}</div><p>Antwoord ${LET[S.myAns]} is vastgelegd. Wacht tot de tijd om is.</p></section>`;
  return h+timerHtml(g)+optsBtn(c.o);
}
function hostView(){
  const g=S.game;
  if(!g)return `${topbar()}<p class="on-green">Laden…</p>`;
  let h=topbar();
  if(S.formOpen)return h+form();
  if(g.phase==='collect'){
    const ids=Object.keys(S.qs),link=location.origin+location.pathname+'?c='+S.code,hm=S.hostMe;
    h+=`<section class="card" style="text-align:center"><div class="mut">Doe mee met code</div><div class="code">${esc(S.code)}</div><p class="mut">of ga naar ${esc(link)}</p><div class="row" style="justify-content:center"><button class="btn sec" data-a="copy">Kopieer link</button></div></section>`;
    const pls=Object.keys(S.players).filter(id=>!S.qs[id]);
    h+=`<section class="card"><h2>Spelers (${ids.length+pls.length})</h2>${ids.length+pls.length?`<div class="pills">${ids.map(id=>`<span class="pill">${esc(S.qs[id].name)} <small>${S.qs[id].qs.length} vragen</small></span>`).join('')}${pls.map(id=>`<span class="pill">${esc(S.players[id].name)} <small>nog geen vragen</small></span>`).join('')}</div>`:'<p class="mut">Nog niemand heeft vragen ingestuurd. Je mag deze pagina sluiten: de code blijft werken en de vragen blijven bewaard.</p>'}</section>`;
    h+=`<section class="card"><h2>Zelf meespelen</h2>${hm?`<p>Je speelt mee als <b>${esc(hm.name)}</b>. ${S.qs[hm.id]?'Je vragen staan erin.':'Je hebt nog geen vragen gemaakt.'}</p><div class="row"><button class="btn sec" data-a="editform">${S.qs[hm.id]?'Mijn vragen aanpassen':'Mijn vragen maken'}</button></div>`:`<p class="mut">Wil je zelf ook vragen maken en antwoorden op dit scherm?</p><label class="lab">Je naam<input id="hn" type="text" maxlength="20"></label><div class="row"><button class="btn sec" data-a="hostme">Ik speel mee</button></div>`}</section>`;
    return h+`<section class="card"><h2>Spelregels</h2><label class="lab">Tijd per vraag<select id="lim"><option value="10">10 seconden</option><option value="20" selected>20 seconden</option><option value="30">30 seconden</option><option value="60">60 seconden</option></select></label><p class="mut">Net als bij Kahoot: een goed antwoord levert tot 1000 punten op. Direct antwoorden geeft 1000, in de laatste seconde 500. Meerdere goede antwoorden achter elkaar geven een reeksbonus, van +100 oplopend tot +500. Fout of te laat geeft 0 punten. Het antwoord wordt getoond zodra iedereen heeft geantwoord of de tijd om is.</p></section><div class="row"><button class="btn big" data-a="start"${ids.length?'':' disabled'}>Start de quiz</button></div><p class="on-green">Wie geen vragen maakt, kan toch meedoen met de code zodra de quiz loopt.</p>`;
  }
  if(g.phase==='done'){
    return h+`<section class="card"><h2>Eindstand</h2>${podium(g.scores)}${board(g.scores,hm0())}</section><div class="row"><button class="btn" data-a="start">Nog een keer spelen</button><button class="btn sec" data-a="leave">Quiz afsluiten</button></div>`;
  }
  const c=g.cur;if(!c)return h;
  const hm=S.hostMe,rev=g.rev,answers=Object.values(S.ans),cnt=[0,0,0,0];
  answers.forEach(a=>{cnt[a.a]++});
  let opts;
  if(hm&&!rev&&c.aid!==hm.id&&S.myAns==null)opts=optsBtn(c.o);
  else opts=optsStatic(c.o,rev?g.c:-1,rev?cnt:null)+(hm&&!rev&&c.aid!==hm.id?'<p class="mut">Jouw antwoord is vastgelegd.</p>':'');
  h+=`<section class="card"><div class="from">Vraag ${c.n} van ${c.tot}, van ${esc(c.au)}</div>${rev?'':timerHtml(g)}<div class="q">${esc(c.q)}</div>${pic(c.img)}${opts}</section>`;
  h+=`<section class="card"><h2>Antwoorden (${answers.length}${rev?'':' van '+expected()})</h2>${answers.length?answers.map(a=>`<div class="sc"><span>${esc(a.name)}</span><span>${SYM[a.a]} ${LET[a.a]}${rev?(a.a===g.c?` <span class="ok">✓ +${(g.gains||{})[a.p]||0}</span>`:' <span class="no">✗</span>'):''}</span></div>`).join(''):'<p class="mut">Nog geen antwoorden binnen.</p>'}</section>`;
  h+=`<div class="row">${rev?`<button class="btn big" data-a="next">${c.n>=c.tot?'Naar de eindstand':'Volgende vraag'}</button>`:'<button class="btn big" data-a="reveal">Toon antwoord</button>'}</div>`;
  if(rev)h+=`<section class="card"><h2>Tussenstand, top 5</h2>${board(g.scores,hm?hm.id:'',5)}</section>`;
  return h;
}
const expected=()=>{
  const g=S.game,aid=g&&g.cur?g.cur.aid:'',me=S.hostMe?S.hostMe.id:'';
  const n=Object.keys(S.players).filter(id=>id!==aid&&id!==me&&S.players[id].seen&&Date.now()-S.players[id].seen<45000).length;
  return n+(me&&me!==aid?1:0);
};
const hm0=()=>S.hostMe?S.hostMe.id:'';
function view(){
  if(!DB)return `${sign()}<div class="card">De database is niet bereikbaar. Controleer je internetverbinding en ververs de pagina.</div>`;
  const b=DEMO?'<div class="alert" style="background:var(--g7)">Voorbeeldmodus: niets wordt opgeslagen en alles verdwijnt bij verversen. Gebruik de code DEMO, als quizmaster of als speler.</div>':'';
  return b+(S.role==='host'?hostView():S.role==='player'?playerView():home());
}
function render(){
  const keep={},rad={},fo=document.activeElement&&document.activeElement.id;
  app.querySelectorAll('input[id],textarea[id],select[id]').forEach(e=>{keep[e.id]=e.value});
  app.querySelectorAll('input[type=radio]:checked').forEach(e=>{rad[e.name]=e.value});
  app.innerHTML=(S.err?`<div class="alert" role="alert">${esc(S.err)}</div>`:'')+view();
  Object.keys(keep).forEach(k=>{const e=$(k);if(e&&keep[k]&&e.type!=='file')e.value=keep[k]});
  Object.keys(rad).forEach(n=>{const e=app.querySelector(`input[name="${n}"][value="${rad[n]}"]`);if(e)e.checked=true});
  S.imgs.forEach((d,i)=>{const pv=$('pv'+i);if(pv&&d){pv.src=d;pv.hidden=false}});
  if(fo&&$(fo)&&$(fo).focus){try{$(fo).focus();const l=$(fo).value.length;$(fo).setSelectionRange(l,l)}catch(e){}}
}

/* ---- events ---- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='join')join();
  else if(a==='newquiz')newQuiz();
  else if(a==='openhost')openHost(b.dataset.c);
  else if(a==='openhost2')openHost($('rc').value);
  else if(a==='leave'){if(S.role==='host'&&S.game&&S.game.phase==='done')ls.del('pq-host');leave()}
  else if(a==='start')startQuiz();
  else if(a==='reveal')revealQ();
  else if(a==='next')nextQ();
  else if(a==='copy')copyLink();
  else if(a==='ans')answer(+b.dataset.i);
  else if(a==='submit')submitQs();
  else if(a==='skip'){S.skip=true;S.formOpen=false;render()}
  else if(a==='editform')openForm();
  else if(a==='closeform'){S.formOpen=false;render()}
  else if(a==='hostme')setHostMe($('hn').value);
});
document.addEventListener('change',e=>{
  const t=e.target,i=t.dataset&&t.dataset.f;
  if(i==null||!t.files||!t.files[0])return;
  resize(t.files[0],d=>{S.imgs[+i]=d;const pv=$('pv'+i);if(pv){pv.src=d;pv.hidden=false}});
});
let tickN=0;
setInterval(()=>{
  tickN++;
  const g=S.game;if(!g||g.phase!=='play'||!g.cur)return;
  if(S.role==='player'&&tickN%60===0)beat();
  if(g.rev)return;
  const lim=(g.limit||20)*1000,el=elapsed(g);
  const tm=$('tm'),tb=$('tb');
  if(tm)tm.textContent=Math.max(0,Math.ceil((lim-el)/1000));
  if(tb)tb.style.width=Math.max(0,(1-el/lim)*100)+'%';
  document.querySelectorAll('[data-a=ans]').forEach(b=>{b.disabled=el>=lim});
  if(S.role==='host'&&!S.revealing){
    const ex=expected();
    if(el>=lim+1500||(ex>0&&Object.keys(S.ans).length>=ex&&el>800))revealQ();
  }
},250);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
render();
})();
</script>
