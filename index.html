<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pubquiz</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2a2118;--mut:#7a6d5c;--ac:#c2410c;--acx:#fff;--bd:#e6dccb;--ok:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1612;--card:#262019;--tx:#f3ebdd;--mut:#a89a85;--ac:#fb923c;--acx:#1b1612;--bd:#3a3128;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px}h2{font-size:18px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
input[type=text],textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--acx);cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.big{font-size:22px;font-weight:700;margin:8px 0}
.code{font-size:48px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--ac)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);font-size:13px;margin:2px}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.err{color:#dc2626;font-size:14px}
img.pic{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:8px auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{color:#fff;border-radius:10px;padding:16px 10px;font-weight:700;text-align:center;border:0;min-height:64px;word-break:break-word}
.o0{background:#dc2626}.o1{background:#2563eb}.o2{background:#d97706}.o3{background:#16a34a}
.opt.dim{opacity:.3}
.opt.win{outline:4px solid var(--tx)}
.sc{display:flex;justify-content:space-between;padding:5px 0}
.qf{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
.qf label{display:flex;gap:8px;align-items:center}
.qf label input[type=text]{margin:3px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
/* Vul hieronder je Firebase-gegevens in om vragen op eigen tempo te kunnen insturen. Leeg laten = alleen live insturen. */
var FB_CFG={apiKey:"AIzaSyA2rK-0SlzxjDjPek-Y2ojCV0dSdVOniCo",authDomain:"pubquiz-e1f69.firebaseapp.com",projectId:"pubquiz-e1f69",storageBucket:"pubquiz-e1f69.firebasestorage.app",messagingSenderId:"1062523724044",appId:"1:1062523724044:web:09d895d25c0f042aaf6929"};
var DB=null;
function fbInit(){if(FB_CFG.projectId&&window.firebase){try{firebase.initializeApp(FB_CFG);DB=firebase.firestore()}catch(e){DB=null}}}
var PER=5,LET=['A','B','C','D'];
var app=document.getElementById('app'),role=null,H=null,P=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mkCode(){var a='ABCDEFGHJKMNPQRSTUVWXYZ',s='';for(var i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function okImg(s){return typeof s==='string'&&s.indexOf('data:image/jpeg;base64,')===0&&s.length<400000?s:''}
function pidGet(){try{var p=localStorage.getItem('pq-pid');if(!p){p=Math.random().toString(36).slice(2);localStorage.setItem('pq-pid',p)}return p}catch(e){return Math.random().toString(36).slice(2)}}
function pic(s){return s?'<img class="pic" src="'+s+'" alt="">':''}
function optsHtml(o,c,mark){return '<div class="opts">'+o.map(function(t,i){return '<div class="opt o'+i+(mark&&i!==c?' dim':'')+(mark&&i===c?' win':'')+'">'+LET[i]+'. '+esc(t)+'</div>'}).join('')+'</div>'}

var SV=null,wl=null,sT=null;
function loadSV(){try{SV=JSON.parse(localStorage.getItem('pq-host'))}catch(e){SV=null}}
function wake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
function saveH(){
  if(!H||role!=='host')return;
  clearTimeout(sT);
  sT=setTimeout(function(){
    try{
      var pl={};
      Object.keys(H.players).forEach(function(k){var p=H.players[k];pl[k]={name:p.name,qs:p.qs,score:p.score,local:p.local,skip:p.skip,fb:p.fb}});
      localStorage.setItem('pq-host',JSON.stringify({code:H.code,players:pl,phase:H.phase,order:H.order,idx:H.idx,rev:H.rev,ans:H.ans}));
    }catch(e){}
  },400);
}
function resumeHost(){
  var d=SV;if(!d)return;
  role='host';
  H={code:d.code,players:{},phase:d.phase,order:d.order||[],idx:d.idx||0,rev:!!d.rev,ans:d.ans||{},t0:Date.now(),err:'',ready:false,imgs:[],resume:true,tries:0};
  Object.keys(d.players).forEach(function(k){var p=d.players[k];H.players[k]={name:p.name,qs:p.qs,score:p.score||0,local:p.local,skip:p.skip,fb:p.fb}});
  wake();openPeer();fbWatch();render();
}
function wipeHost(){
  clearTimeout(sT);
  try{localStorage.removeItem('pq-host')}catch(e){}
  if(H&&H.unsub)try{H.unsub()}catch(e){}
  if(H&&H.peer)try{H.peer.destroy()}catch(e){}
  H=null;SV=null;role=null;render();
}

function cleanQs(arr){
  var list=[];
  (Array.isArray(arr)?arr:[]).slice(0,10).forEach(function(x){
    if(x&&x.q&&Array.isArray(x.o)&&x.o.length===4&&x.c>=0&&x.c<4)
      list.push({q:String(x.q).slice(0,300),o:x.o.map(function(t){return String(t).slice(0,80)}),c:x.c|0,img:okImg(x.img)});
  });
  return list;
}
function fbWatch(){
  if(!DB||!H||H.unsub)return;
  H.unsub=DB.collection('games').doc(H.code).collection('questions').onSnapshot(function(snap){
    if(!H||H.phase!=='lobby')return;
    var ch=false;
    snap.forEach(function(d){
      var x=d.data(),key='fb:'+d.id,nm=String(x.name||'Speler').slice(0,20),qs=cleanQs(x.qs);
      if(!qs.length)return;
      var dup=Object.keys(H.players).some(function(k){var y=H.players[k];return k!==key&&!y.fb&&y.qs&&y.name.toLowerCase()===nm.toLowerCase()});
      if(dup)return;
      var cur=H.players[key];
      H.players[key]={name:nm,qs:qs,score:cur?cur.score:0,fb:true,conn:cur?cur.conn:null};
      ch=true;
    });
    if(ch)render();
  },function(){});
}
function fbSubmit(qs){
  var fe=$('fe'),id=P.name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,30)||'speler';
  var data={name:P.name,qs:qs,ts:Date.now()};
  if(JSON.stringify(data).length>900000){fe.textContent='De afbeeldingen zijn samen te groot. Haal er een of twee weg.';return}
  fe.textContent='Versturen…';
  DB.collection('games').doc(P.code).collection('questions').doc(id).set(data).then(function(){P.view='sent';render()}).catch(function(){fe.textContent='Versturen mislukt. Controleer je verbinding en de Firebase-instellingen.'});
}

/* ---------- HOST ---------- */
function startHost(){
  role='host';
  H={code:mkCode(),players:{},phase:'lobby',order:[],idx:0,rev:false,ans:{},t0:0,err:'',ready:false,imgs:[]};
  SV=null;try{localStorage.removeItem('pq-host')}catch(e){}
  wake();openPeer();fbWatch();render();
}
function openPeer(){
  if(H.peer)try{H.peer.destroy()}catch(e){}
  var pr=new Peer('pubq-'+H.code);H.peer=pr;
  pr.on('open',function(){H.ready=true;H.resume=false;render()});
  pr.on('disconnected',function(){try{pr.reconnect()}catch(e){}});
  pr.on('error',function(e){
    if(e.type==='unavailable-id'){
      if(H.resume){
        if(H.tries<20){H.tries++;setTimeout(function(){if(role==='host'&&H&&H.resume)openPeer()},3000)}
        else{H.err='De code is nog bezet. Wacht een paar minuten en kies opnieuw "Hervat quiz".';render()}
      }else{H.code=mkCode();openPeer()}
    }
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'){}
    else{H.err='Verbindingsfout ('+e.type+'). Ververs de pagina en probeer opnieuw.';render()}
  });
  pr.on('connection',function(c){
    c.on('data',function(m){hostMsg(c,m)});
    c.on('close',function(){var p=H.players[c._pid];if(p&&p.conn===c)p.conn=null;render()});
  });
}
function hostMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    var p=H.players[m.pid];
    if(!p){
      var nm=String(m.name||'Speler').slice(0,20),fk=null;
      Object.keys(H.players).forEach(function(k){var x=H.players[k];if(x.fb&&!x.conn&&x.name.toLowerCase()===nm.toLowerCase())fk=k});
      if(fk){p=H.players[m.pid]=H.players[fk];delete H.players[fk];p.fb=false}
      else p=H.players[m.pid]={name:nm,qs:null,score:0};
    }
    p.conn=c;c._pid=m.pid;send(m.pid);render();return;
  }
  var pid=c._pid,pl=H.players[pid];if(!pl)return;
  if(m.t==='skip'&&H.phase==='lobby'){pl.skip=true;send(pid);render()}
  if(m.t==='qs'&&H.phase==='lobby'&&Array.isArray(m.qs)){
    var list=[];
    m.qs.slice(0,10).forEach(function(x){
      if(x&&x.q&&Array.isArray(x.o)&&x.o.length===4&&x.c>=0&&x.c<4)
        list.push({q:String(x.q).slice(0,300),o:x.o.map(function(t){return String(t).slice(0,80)}),c:x.c|0,img:okImg(x.img)});
    });
    if(list.length){pl.qs=list;send(pid);render()}
  }
  if(m.t==='ans'&&H.phase==='play'&&!H.rev){
    var it=H.order[H.idx];
    if(it[0]!==pid&&!(pid in H.ans)&&m.a>=0&&m.a<4){H.ans[pid]={a:m.a|0,dt:Date.now()-H.t0};send(pid);render()}
  }
}
function board(){return Object.keys(H.players).map(function(k){return{name:H.players[k].name,score:H.players[k].score}}).sort(function(a,b){return b.score-a.score})}
function stateFor(pid){
  var p=H.players[pid];
  if(H.phase==='lobby')return{t:'wait',sub:!!(p.qs||p.skip),n:Object.keys(H.players).length};
  if(H.phase==='done')return{t:'end',board:board(),me:p.score};
  var it=H.order[H.idx],q=H.players[it[0]].qs[it[1]],mine=it[0]===pid;
  if(!H.rev)return{t:'q',n:H.idx+1,tot:H.order.length,q:q.q,img:q.img,o:q.o,mine:mine,done:pid in H.ans};
  var a=H.ans[pid];
  return{t:'rev',c:q.c,o:q.o,y:a?a.a:-1,gain:a&&a.a===q.c?a.g:0,score:p.score,mine:mine};
}
function send(pid){var p=H.players[pid];if(p&&p.conn&&p.conn.open)try{p.conn.send(stateFor(pid))}catch(e){}}
function broadcast(){Object.keys(H.players).forEach(send)}
function startQuiz(){
  if(H.unsub){H.unsub();H.unsub=null}
  var o=[];
  Object.keys(H.players).forEach(function(k){var p=H.players[k];if(p.qs)p.qs.forEach(function(_,j){o.push([k,j])})});
  for(var i=o.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=o[i];o[i]=o[j];o[j]=t}
  H.order=o;H.idx=0;H.rev=false;H.ans={};H.t0=Date.now();H.phase='play';
  Object.keys(H.players).forEach(function(k){H.players[k].score=0});
  broadcast();render();
}
function revealQ(){
  var it=H.order[H.idx],q=H.players[it[0]].qs[it[1]];
  Object.keys(H.ans).forEach(function(k){
    var a=H.ans[k];
    if(a.a===q.c){a.g=100+Math.round(Math.max(0,100-a.dt/200));H.players[k].score+=a.g}else a.g=0;
  });
  H.rev=true;broadcast();render();
}
function nextQ(){
  H.idx++;
  if(H.idx>=H.order.length)H.phase='done';
  else{H.rev=false;H.ans={};H.t0=Date.now()}
  broadcast();render();
}
function hostView(){
  var h='<h1>🍻 Pubquiz – host</h1>';
  if(H.err)return h+'<div class="card err">'+esc(H.err)+'</div>';
  if(!H.ready)return h+'<p class="mut">'+(H.resume?'Quiz hervatten… even geduld (dit kan een minuutje duren).':'Verbinden…')+'</p>';
  var ks=Object.keys(H.players),sub=ks.filter(function(k){return H.players[k].qs}).length;
  if(H.phase==='lobby'){
    var link=location.origin+location.pathname+'?c='+H.code;
    h+='<div class="card"><div class="mut" style="text-align:center">Doe mee met code</div><div class="code">'+H.code+'</div><p class="mut" style="text-align:center">of open<br>'+esc(link)+'</p>'+(DB?'<p class="mut" style="text-align:center">Spelers kunnen ook insturen als jij niet online bent. Je kunt deze pagina sluiten; de code blijft bewaard.</p>':'')+'</div>';
    h+='<div class="card"><h2>Spelers ('+ks.length+') · vragen ingestuurd: '+sub+'</h2>';
    ks.forEach(function(k){var p=H.players[k];h+='<span class="pill'+(p.qs||p.skip?' ok':'')+'">'+(p.qs||p.skip?'✓ ':'… ')+esc(p.name)+(p.conn||p.local?'':' (offline)')+'</span>'});
    if(!ks.length)h+='<span class="mut">Nog niemand.</span>';
    h+='</div>';
    var me=H.players.host;
    if(!me)h+='<div class="card"><h2>Zelf meespelen?</h2><input type="text" id="hn" placeholder="Je naam" maxlength="20"><button class="sec" data-act="hjoin">Ik speel ook mee</button></div>';
    else if(!me.qs)h+=formHtml(me.name,'hsubmit');
    else h+='<div class="card">✓ Jouw vragen staan erin, '+esc(me.name)+'.</div>';
    h+='<button data-act="start"'+(sub<1||ks.length<2?' disabled':'')+'>Start de quiz</button><p class="mut">Houd dit scherm open tijdens de hele quiz. Wie zijn eigen vragen heeft ingestuurd, slaat die zelf over.</p>';
  }else if(H.phase==='play'){
    var it=H.order[H.idx],au=H.players[it[0]],q=au.qs[it[1]];
    var need=ks.filter(function(k){return k!==it[0]&&(H.players[k].conn||H.players[k].local)}).length,got=Object.keys(H.ans).length;
    h+='<div class="card"><div class="mut">Vraag '+(H.idx+1)+' van '+H.order.length+' · van '+esc(au.name)+'</div><div class="big">'+esc(q.q)+'</div>'+pic(q.img)+hostOpts(q,it)+'</div>';
    h+='<div class="card"><h2>Antwoorden '+got+' / '+need+'</h2>';
    Object.keys(H.ans).forEach(function(k){
      var a=H.ans[k];
      h+='<div class="sc"><span>'+esc(H.players[k].name)+'</span><span>'+LET[a.a]+(H.rev?(a.a===q.c?' ✔ +'+a.g:' ✘'):'')+'</span></div>';
    });
    if(!got)h+='<span class="mut">Nog geen antwoorden.</span>';
    h+='</div><div class="row">'+(H.rev?'<button data-act="next">'+(H.idx+1>=H.order.length?'Naar de uitslag':'Volgende vraag')+'</button>':'<button data-act="rev">Toon antwoord</button>')+'</div>';
    if(H.rev)h+=boardHtml();
  }else{
    h+='<div class="card"><h2>🏆 Uitslag</h2></div>'+boardHtml();
  }
  return h+'<p><button class="sec" data-act="wipe">Quiz wissen</button></p>';
}
function boardHtml(){
  return '<div class="card"><h2>Stand</h2>'+board().map(function(b,i){return '<div class="sc"><span>'+(i+1)+'. '+esc(b.name)+'</span><b>'+b.score+'</b></div>'}).join('')+'</div>';
}

/* ---------- PLAYER ---------- */
function joinGame(){
  var code=$('jc').value.trim().toUpperCase(),name=$('jn').value.trim();
  if(!code||!name){P=P||{};P.err='Vul code en naam in';render();return}
  role='player';wake();
  P={code:code,name:name,pid:pidGet(),view:'conn',m:null,imgs:[],err:''};
  render();connectP();
}
function connectP(){
  P.view='conn';P.err='';render();
  if(P.peer)try{P.peer.destroy()}catch(e){}
  var pr=new Peer();P.peer=pr;
  pr.on('open',function(){
    var c=pr.connect('pubq-'+P.code,{reliable:true});P.conn=c;
    c.on('open',function(){c.send({t:'join',pid:P.pid,name:P.name})});
    c.on('data',playerMsg);
    c.on('close',function(){if(P.view!=='home'){P.view='lost';render()}});
  });
  pr.on('error',function(e){
    if(e.type==='peer-unavailable'&&DB){P.mode='fb';P.view='form';render();return}
    P.view='home';role=null;
    P.err=e.type==='peer-unavailable'?'Spel niet gevonden. Controleer de code, of vraag of de host de quiz open heeft staan.':'Verbindingsfout ('+e.type+')';
    render();
  });
}
function playerMsg(m){
  if(!m||!m.t)return;
  if(m.t==='err'){P.view='err';P.err=m.m}
  else if(m.t==='wait'){
    if(m.sub){P.view='wait';P.n=m.n}
    else if(P.view!=='form')P.view='form';
    else return;
  }
  else{P.view=m.t;P.m=m}
  render();
}
function formHtml(name,act){
  var h='<div class="card"><h2>Hoi '+esc(name)+'! Maak '+PER+' vragen</h2><p class="mut">'+(act==='submit'&&P&&P.mode==='fb'?'De host is nu niet online, maar je kunt je vragen alvast insturen. ':'')+'Vier antwoorden per vraag, kies het goede met het bolletje. Een afbeelding is optioneel.</p>';
  for(var i=0;i<PER;i++){
    h+='<div class="qf"><b>Vraag '+(i+1)+'</b><textarea id="q'+i+'" rows="2" placeholder="Vraag"></textarea>';
    h+='<input type="file" accept="image/*" data-f="'+i+'"><img class="pic" id="pv'+i+'" alt="" style="display:none">';
    for(var j=0;j<4;j++)h+='<label><input type="radio" name="c'+i+'" value="'+j+'"><input type="text" id="o'+i+'_'+j+'" placeholder="Antwoord '+LET[j]+'"></label>';
    h+='</div>';
  }
  return h+'<p class="err" id="fe"></p><button data-act="'+act+'">Versturen</button>'+(act==='submit'&&!(P&&P.mode==='fb')?' <button class="sec" data-act="skip">Ik speel alleen mee</button>':'')+'</div>';
}
function playerView(){
  var h='<h1>🍻 Pubquiz</h1>';
  var m=P.m,v=P.view;
  if(v==='conn')return h+'<p class="mut">Verbinden…</p>';
  if(v==='lost')return h+'<div class="card"><p>Verbinding weg.</p><button data-act="reconnect">Opnieuw verbinden</button></div>';
  if(v==='err')return h+'<div class="card err">'+esc(P.err)+'</div>';
  if(v==='form')return h+formHtml(P.name,'submit');
  if(v==='sent')return h+'<div class="card"><h2>✓ Verstuurd</h2><p>Je vragen staan klaar voor de quiz. Wil je iets wijzigen? Doe opnieuw mee met dezelfde code en naam en stuur ze nog eens in.</p></div>';
  if(v==='wait')return h+'<div class="card"><h2>✓ Je staat erin</h2><p>Je gegevens zijn bij de host opgeslagen. Wacht tot de quiz start… ('+(P.n||1)+' spelers)</p></div>';
  if(v==='q'){
    h+='<div class="mut">Vraag '+m.n+' van '+m.tot+'</div><div class="card"><div class="big">'+esc(m.q)+'</div>'+pic(m.img)+'</div>';
    if(m.mine)return h+'<div class="card">Dit is jouw vraag. Jij mag niet meedoen. 😉</div>';
    if(m.done)return h+'<div class="card">Antwoord ontvangen ✓<br><span class="mut">Wacht op de host…</span></div>';
    return h+'<div class="opts">'+m.o.map(function(t,i){return '<button class="opt o'+i+'" data-act="ans" data-i="'+i+'">'+LET[i]+'. '+esc(t)+'</button>'}).join('')+'</div>';
  }
  if(v==='rev'){
    if(m.mine)return h+'<div class="card">Jouw vraag is besproken. Goed antwoord: '+LET[m.c]+'.</div>';
    var good=m.y===m.c;
    return h+'<div class="card"><div class="big">'+(m.y<0?'⏱ Niet beantwoord':good?'✔ Goed! +'+m.gain:'✘ Helaas')+'</div><p>Goede antwoord: <b>'+LET[m.c]+'. '+esc(m.o[m.c])+'</b></p><p class="mut">Jouw score: '+m.score+'</p></div>';
  }
  if(v==='end')return h+'<div class="card"><h2>🏆 Uitslag</h2>'+m.board.map(function(b,i){return '<div class="sc"><span>'+(i+1)+'. '+esc(b.name)+'</span><b>'+b.score+'</b></div>'}).join('')+'</div>';
  return h;
}
function collectQs(imgs){
  var qs=[],fe=$('fe');
  for(var i=0;i<PER;i++){
    var q=$('q'+i).value.trim(),o=[],r=document.querySelector('input[name="c'+i+'"]:checked');
    for(var j=0;j<4;j++)o.push($('o'+i+'_'+j).value.trim());
    if(!q||o.some(function(x){return !x})||!r){fe.textContent='Vraag '+(i+1)+': vul de vraag, alle 4 antwoorden en het goede antwoord in.';return null}
    qs.push({q:q,o:o,c:parseInt(r.value,10),img:imgs[i]||''});
  }
  return qs;
}
function submitQs(){
  var qs=collectQs(P.imgs);if(!qs)return;
  if(P.mode==='fb'){fbSubmit(qs);return}
  P.conn.send({t:'qs',qs:qs});$('fe').textContent='Versturen…';
}
function hostSubmit(){
  var qs=collectQs(H.imgs);if(!qs)return;
  H.players.host.qs=qs;render();
}
function hostJoin(){
  var n=$('hn').value.trim();if(!n)return;
  H.players.host={name:n,qs:null,score:0,local:true};render();
}
function hostAns(i){
  var it=H.order[H.idx];
  if(H.rev||it[0]==='host'||('host' in H.ans))return;
  H.ans.host={a:i,dt:Date.now()-H.t0};render();
}
function hostOpts(q,it){
  var me=H.players.host;
  if(me&&!H.rev){
    if(it[0]==='host')return '<p class="mut">Dit is jouw vraag, jij doet niet mee.</p>'+optsHtml(q.o,q.c,false);
    if(!('host' in H.ans))return '<div class="opts">'+q.o.map(function(t,i){return '<button class="opt o'+i+'" data-act="hans" data-i="'+i+'">'+LET[i]+'. '+esc(t)+'</button>'}).join('')+'</div>';
    return optsHtml(q.o,q.c,false)+'<p class="mut">Jouw antwoord is vastgelegd.</p>';
  }
  return optsHtml(q.o,q.c,H.rev);
}
function resize(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.6));
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- ROUTING ---------- */
function homeView(){
  var qc=(new URLSearchParams(location.search).get('c')||'').toUpperCase();
  if(P&&P.code&&!qc)qc=P.code;
  return '<h1>🍻 Pubquiz</h1><div class="mut">Maak samen een quiz met vragen van iedereen.</div>'+
  '<div class="card"><h2>Meedoen</h2><input type="text" id="jc" placeholder="Code (4 letters)" maxlength="4" value="'+esc(qc)+'" autocapitalize="characters"><input type="text" id="jn" placeholder="Je naam" maxlength="20" value="'+esc(P&&P.name||'')+'"><div class="err">'+esc(P&&P.err||'')+'</div><button data-act="join">Doe mee</button></div>'+
  (SV?'<div class="card"><h2>Bewaarde quiz</h2><p class="mut">Code '+esc(SV.code)+' · '+Object.keys(SV.players).length+' spelers</p><div class="row"><button data-act="resume">Hervat quiz</button><button class="sec" data-act="discard">Weggooien</button></div></div>':'')+'<div class="card"><h2>Host</h2><p class="mut">Open dit op de laptop of tv. Spelers doen mee met hun telefoon.</p><button class="sec" data-act="host">Nieuwe quiz starten</button></div>';
}
function render(){
  var keep={},rad={},fo=document.activeElement&&document.activeElement.id;
  app.querySelectorAll('input[id],textarea[id]').forEach(function(e){keep[e.id]=e.value});
  app.querySelectorAll('input[type=radio]:checked').forEach(function(e){rad[e.name]=e.value});
  app.innerHTML=role==='host'?hostView():role==='player'?playerView():homeView();
  Object.keys(keep).forEach(function(k){var e=$(k);if(e&&keep[k])e.value=keep[k]});
  Object.keys(rad).forEach(function(n){var e=app.querySelector('input[name="'+n+'"][value="'+rad[n]+'"]');if(e)e.checked=true});
  var im=(role==='host'?H&&H.imgs:P&&P.imgs)||[];
  im.forEach(function(d,i){var pv=$('pv'+i);if(pv&&d){pv.src=d;pv.style.display='block'}});
  if(fo&&$(fo)){try{$(fo).focus();var l=$(fo).value.length;$(fo).setSelectionRange(l,l)}catch(e){}}
  if(role==='host')saveH();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='host'){if(SV&&!confirm('Er staat nog een bewaarde quiz. Die wordt vervangen. Doorgaan?'))return;startHost()}
  else if(a==='resume')resumeHost();
  else if(a==='discard'){try{localStorage.removeItem('pq-host')}catch(x){}SV=null;render()}
  else if(a==='wipe'){if(confirm('Quiz wissen? Alle vragen en scores gaan verloren.'))wipeHost()}
  else if(a==='skip')P.conn.send({t:'skip'});
  else if(a==='join')joinGame();
  else if(a==='start')startQuiz();
  else if(a==='rev')revealQ();
  else if(a==='next')nextQ();
  else if(a==='submit')submitQs();
  else if(a==='reconnect')connectP();
  else if(a==='hjoin')hostJoin();
  else if(a==='hsubmit')hostSubmit();
  else if(a==='hans')hostAns(parseInt(b.getAttribute('data-i'),10));
  else if(a==='ans'){P.conn.send({t:'ans',a:parseInt(b.getAttribute('data-i'),10)});P.m.done=true;render()}
});
document.addEventListener('change',function(e){
  var t=e.target,i=t.getAttribute&&t.getAttribute('data-f');
  if(i==null||!t.files||!t.files[0])return;
  resize(t.files[0],function(d){(role==='host'?H.imgs:P.imgs)[i]=d;var pv=$('pv'+i);pv.src=d;pv.style.display='block'});
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  wake();
  if(role==='host'&&H&&H.peer){
    if(H.peer.destroyed){H.ready=false;H.resume=true;H.tries=0;openPeer();render()}
    else if(H.peer.disconnected){try{H.peer.reconnect()}catch(x){}}
  }else if(role==='player'&&P&&P.view==='lost')connectP();
});
fbInit();
loadSV();
render();
})();
</script>
</body>
</html>
