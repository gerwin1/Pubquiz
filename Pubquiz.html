<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pubquiz</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2a2118;--mut:#7a6d5c;--ac:#c2410c;--acx:#fff;--bd:#e6dccb;--ok:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#262019;--tx:#f3ebdd;--mut:#a89a85;--ac:#fb923c;--acx:#1b1612;--bd:#3a3128;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#262019;--tx:#f3ebdd;--mut:#a89a85;--ac:#fb923c;--acx:#1b1612;--bd:#3a3128;--ok:#4ade80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px}h2{font-size:18px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--acx);cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q{padding:10px 0;border-top:1px solid var(--bd)}.q:first-of-type{border-top:0}
.big{font-size:22px;font-weight:700;margin:8px 0}
.ans{color:var(--ok);font-weight:700;font-size:20px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);font-size:13px;margin:2px}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.sc{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.sc button{padding:4px 12px}
</style>
</head>
<body>
<main id="app"><p class="mut">Laden…</p></main>
<script>
(function(){
var TOTAL=7, PER=5;
var app=document.getElementById('app');
var db=null,user=null,uid=null,isHost=false;
var qs={},game={phase:'collect'},draft=null,saving=false,err='';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mine(){return uid&&qs[uid]}
function ensureDraft(){
  if(draft)return;
  var m=mine();
  draft={name:m?m.name:'',qs:[]};
  for(var i=0;i<PER;i++)draft.qs.push(m&&m.qs[i]?{q:m.qs[i].q,a:m.qs[i].a}:{q:'',a:''});
}
function readDraft(){
  if(!draft)return;
  var n=document.getElementById('nm');if(n)draft.name=n.value;
  for(var i=0;i<PER;i++){var q=document.getElementById('q'+i),a=document.getElementById('a'+i);if(q)draft.qs[i].q=q.value;if(a)draft.qs[i].a=a.value;}
}
function render(){
  if(!db){app.innerHTML='<h1>🍻 Pubquiz</h1><div class="card">Log in via Claude om mee te doen. Deze pagina kan de gedeelde gegevens nu niet openen.</div>';return;}
  var h='<h1>🍻 Pubquiz</h1><div class="mut">'+TOTAL+' vrienden, elk '+PER+' vragen</div>';
  var ids=Object.keys(qs);
  if(game.phase==='collect'){
    var done=ids.filter(function(i){return qs[i].qs.length>=PER}).length;
    h+='<div class="card"><h2>Ingestuurd: '+done+' / '+TOTAL+'</h2>';
    ids.forEach(function(i){h+='<span class="pill ok">✓ '+esc(qs[i].name||'Naamloos')+'</span>'});
    if(!ids.length)h+='<span class="mut">Nog niemand.</span>';
    h+='</div>';
    ensureDraft();
    h+='<div class="card"><h2>Jouw '+PER+' vragen</h2><input id="nm" placeholder="Je naam" value="'+esc(draft.name)+'">';
    for(var i=0;i<PER;i++){
      h+='<div class="q"><b>Vraag '+(i+1)+'</b><textarea id="q'+i+'" rows="2" placeholder="Vraag">'+esc(draft.qs[i].q)+'</textarea><input id="a'+i+'" placeholder="Antwoord" value="'+esc(draft.qs[i].a)+'"></div>';
    }
    h+='<div class="row"><button id="save"'+(saving?' disabled':'')+'>'+(mine()?'Bijwerken':'Versturen')+'</button><span class="mut">'+esc(err)+'</span></div>';
    h+='<p class="mut">Let op: antwoorden zijn technisch zichtbaar in de gedeelde data. Niet spieken!</p></div>';
    if(isHost)h+='<div class="card"><h2>Host</h2><p class="mut">Start zodra iedereen klaar is. De vragen worden door elkaar gehusseld.</p><button id="start"'+(done<1?' disabled':'')+'>Start de quiz</button></div>';
  }else if(game.phase==='play'){
    var it=game.order[game.idx],o=qs[it.uid],qq=o&&o.qs[it.i];
    h+='<div class="card"><div class="mut">Vraag '+(game.idx+1)+' van '+game.order.length+(o?' · van '+esc(o.name):'')+'</div><div class="big">'+esc(qq?qq.q:'(vraag ontbreekt)')+'</div>';
    if(game.reveal)h+='<div class="ans">✔ '+esc(qq?qq.a:'')+'</div>';
    else h+='<div class="mut">Schrijf je antwoord op papier…</div>';
    h+='</div>';
    if(isHost){
      h+='<div class="row">';
      if(!game.reveal)h+='<button id="rev">Toon antwoord</button>';
      else h+='<button id="next">'+(game.idx+1>=game.order.length?'Naar de uitslag':'Volgende vraag')+'</button>';
      h+='</div>';
    }else h+='<p class="mut">De host bepaalt wanneer de volgende vraag komt.</p>';
    h+=scoreboard();
  }else{
    h+='<div class="card"><h2>🏆 Uitslag</h2></div>'+scoreboard();
    if(isHost)h+='<button class="sec" id="reset">Opnieuw beginnen</button>';
  }
  app.innerHTML=h;
  bind();
}
function scoreboard(){
  var sc=game.scores||{},ids=Object.keys(qs).sort(function(a,b){return (sc[b]||0)-(sc[a]||0)});
  var h='<div class="card"><h2>Scores</h2>';
  ids.forEach(function(i){
    h+='<div class="sc"><span>'+esc(qs[i].name)+'</span><span class="row"><b>'+(sc[i]||0)+'</b>'+(isHost&&game.phase==='play'?'<button class="sec" data-s="'+i+'" data-d="-1">−</button><button class="sec" data-s="'+i+'" data-d="1">+</button>':'')+'</span></div>';
  });
  return h+'</div>';
}
function setGame(patch){
  var g=Object.assign({},game,patch);
  return db.doc('game/state').set(g).catch(function(e){err='Opslaan mislukt';render();});
}
function bind(){
  var $=function(id){return document.getElementById(id)};
  ['nm','q0','q1','q2','q3','q4','a0','a1','a2','a3','a4'].forEach(function(id){var e=$(id);if(e)e.addEventListener('input',readDraft)});
  if($('save'))$('save').onclick=function(){
    readDraft();
    var name=draft.name.trim();
    var list=draft.qs.map(function(x){return{q:x.q.trim(),a:x.a.trim()}}).filter(function(x){return x.q&&x.a});
    if(!name){err='Vul je naam in';render();return}
    if(list.length<PER){err='Vul alle '+PER+' vragen én antwoorden in';render();return}
    saving=true;err='';render();
    db.doc('questions/'+uid).set({name:name,qs:list}).then(function(){saving=false;err='Opgeslagen ✓';draft=null;render()}).catch(function(){saving=false;err='Opslaan mislukt (alleen deelnemers met schrijfrechten)';render()});
  };
  if($('start'))$('start').onclick=function(){
    var order=[];
    Object.keys(qs).forEach(function(u){qs[u].qs.forEach(function(_,i){order.push({uid:u,i:i})})});
    for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t}
    var sc={};Object.keys(qs).forEach(function(u){sc[u]=0});
    setGame({phase:'play',order:order,idx:0,reveal:false,scores:sc});
  };
  if($('rev'))$('rev').onclick=function(){setGame({reveal:true})};
  if($('next'))$('next').onclick=function(){
    if(game.idx+1>=game.order.length)setGame({phase:'done'});else setGame({idx:game.idx+1,reveal:false});
  };
  if($('reset'))$('reset').onclick=function(){if(confirm('Weet je het zeker? Scores worden gewist.'))setGame({phase:'collect',order:[],idx:0,reveal:false,scores:{}})};
  Array.prototype.forEach.call(document.querySelectorAll('[data-s]'),function(b){
    b.onclick=function(){var sc=Object.assign({},game.scores||{});var k=b.getAttribute('data-s');sc[k]=Math.max(0,(sc[k]||0)+parseInt(b.getAttribute('data-d'),10));setGame({scores:sc})};
  });
}
function typing(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')}
function init(){
  if(!window.claude){render();return}
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    db=r[0];user=r[1];
    if(!db||!user){render();return}
    isHost=!!(user.isOwner()||user.canEdit());
    return user.id().then(function(id){
      uid=id;render();
      db.collection('questions').onSnapshot(function(s){
        qs={};s.docs.forEach(function(d){var x=d.data();if(x&&x.qs)qs[d.id]=x});
        if(!typing())render();
      },function(){});
      db.doc('game/state').onSnapshot(function(s){
        game=s.exists?s.data():{phase:'collect'};
        if(!typing()||game.phase!=='collect')render();
      },function(){});
    });
  }).catch(function(){render()});
}
init();
})();
</script>
</body>
</html>
